const MONTH_RE=/(January|February|March|April|May|June|July|August|September|October|November|December)\s+(\d{1,2}),\s+(\d{4})/i;
function parseCosts(sheets){
  for(const sh of sheets){
    const rows=sh.rows;let hi=-1,H=null;
    for(let i=0;i<Math.min(12,rows.length);i++){const h=rows[i].map(c=>String(c).trim().toLowerCase());if(h.some(c=>c==="date"||c==="txn date"||c==="transaction date")&&h.some(c=>/amount|debit|cost|total/.test(c))){hi=i;H=h;break}}
    if(hi>=0){ // dated transactions: cost by month
      const cD=H.findIndex(c=>/^(date|txn date|transaction date)$/.test(c));let cA=H.findIndex(c=>c==="amount");if(cA<0)cA=H.findIndex(c=>/debit|cost|amount|total/.test(c));
      const byMonth={};let total=0,last=null,n=0;
      rows.slice(hi+1).forEach(r=>{if(r.some(c=>/^total/i.test(String(c).trim())))return;const d=parseDay(r[cD]);const a=num(r[cA]);if(d==null||a==null)return;byMonth[monthKey(d)]=(byMonth[monthKey(d)]||0)+a;total+=a;n++;if(last==null||d>last)last=d});
      if(n)return {total:Math.round(total*100)/100,byMonth,asOf:ds(last),kind:"dated",count:n};
    }
  }
  // summary report (e.g. QuickBooks "Expenses by Vendor"): vendor rows and a TOTAL row; the run date sits in the footer
  for(const sh of sheets){
    let total=null,asOf=null;const vendors=[];
    sh.rows.forEach(r=>{const first=String(r[0]==null?"":r[0]).trim();const amt=r.slice(1).map(num).find(v=>v!=null);
      const txt=r.map(c=>String(c)).join(" ");const m=txt.match(MONTH_RE);if(m)asOf=Math.round(Date.UTC(+m[3],MONS.indexOf(m[1].slice(0,3).toLowerCase()),+m[2])/DAY);
      if(/^total$/i.test(first)&&amt!=null)total=amt;else if(first&&amt!=null&&!/^total/i.test(first))vendors.push({name:first,amount:amt})});
    if(total==null&&vendors.length)total=vendors.reduce((a,v)=>a+v.amount,0);
    if(total!=null)return {total:Math.round(total*100)/100,byMonth:null,asOf:ds(asOf!=null?asOf:TODAY),kind:"summary",vendors:vendors.slice(0,60),asOfGuessed:asOf==null};
  }
  return null;
}
async function onCostFile(input){
  const file=input.files&&input.files[0];input.value="";if(!file)return;

    if(!c){toast("Couldn’t find costs in that file. Use a report with a Date and Amount column, or a vendor summary with a TOTAL row.");return}
    c.fileName=file.name;c.uploadedAt=Date.now();

function earnedAsOf(n){

const MONS=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
function parseMonthLabel(v){const m=String(v==null?"":v).trim().toLowerCase().match(/^([a-z]{3})[a-z]*\.?[\s\-\/']*(\d{2}|\d{4})$/);if(!m)return null;const mi=MONS.indexOf(m[1]);if(mi<0)return null;let y=+m[2];if(y<100)y+=2000;return {y,m:mi}}
function parseDay(v,endOfMonth){
  if(v instanceof Date&&!isNaN(v))return Math.round(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate())/DAY);
  if(typeof v==="number"&&v>20000&&v<80000)return Math.round(v)-25569; // Excel serial date
  const s=String(v==null?"":v).trim();if(!s)return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return Math.round(Date.UTC(+m[1],+m[2]-1,+m[3])/DAY);
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return Math.round(Date.UTC(y,+m[1]-1,+m[2])/DAY)}
  const ml=parseMonthLabel(s);if(ml)return Math.round((endOfMonth?Date.UTC(ml.y,ml.m+1,0):Date.UTC(ml.y,ml.m,1))/DAY);
  return null;
}

/* ---------- import projects from the staffing planner export ---------- */
// Accepts a sheet with Project/Job + Contract + Start/End columns, or the planner's own CSVs
// (month columns like "Jul-26": first and last non-empty month give the start and end).
function projectsFromSheets(sheets){
  const out=new Map();
  for(const sh of sheets){
    const rows=sh.rows;let hi=-1,H=null;
    for(let i=0;i<Math.min(12,rows.length);i++){const h=rows[i].map(c=>String(c).trim().toLowerCase());if(h.some(c=>/^(project|job|project name|job name)$/.test(c))){hi=i;H=h;break}}
    if(hi<0)continue;
    const col=re=>H.findIndex(c=>re.test(c));
    const cN=col(/^(project|job|project name|job name)$/),cC=col(/contract/),cS=col(/^(start|starts|start date|begin|start month)/),cE=[/^end ?date$/,/^(end|ends|finish|completion|end month)/].map(col).find(i=>i>=0)??-1,cCat=col(/^category$/);
    const monthCols=H.map((c,i)=>parseMonthLabel(c)?i:-1).filter(i=>i>=0);
    for(const r of rows.slice(hi+1)){
      const name=String(r[cN]==null?"":r[cN]).trim();if(!name||/^(grand )?total/i.test(name))continue;
      const k=name.toLowerCase();const o=out.get(k)||{name,contract:null,start:null,end:null,category:""};
      if(cC>=0){const v=num(r[cC]);if(v&&!o.contract)o.contract=v}
      if(cCat>=0&&r[cCat])o.category=String(r[cCat]);
      let ms=null,me=null;
      monthCols.forEach(i=>{const v=r[i];if(v===""||v==null||v===0||String(v).trim()==="0")return;const ml=parseMonthLabel(H[i]);const a=Math.round(Date.UTC(ml.y,ml.m,1)/DAY),b=Math.round(Date.UTC(ml.y,ml.m+1,0)/DAY);if(ms==null||a<ms)ms=a;if(me==null||b>me)me=b});
      const st=cS>=0?parseDay(r[cS],false):null,en=cE>=0?parseDay(r[cE],true):null;
      // explicit Start/End columns win over dates inferred from month columns
      if(st!=null){o.start=o.startX?Math.min(o.start,st):st;o.startX=true}else if(ms!=null&&!o.startX&&(o.start==null||ms<o.start))o.start=ms;
      if(en!=null){o.end=o.endX?Math.max(o.end,en):en;o.endX=true}else if(me!=null&&!o.endX&&(o.end==null||me>o.end))o.end=me;
      out.set(k,o);
    }
  }
  return [...out.values()].sort((a,b)=>a.name.localeCompare(b.name));
}

/* ---------- budget import ---------- */
function detectBudget(rows){
  let hi=0;
  for(let i=0;i<Math.min(15,rows.length);i++){const h=rows.slice(i,i+3).flat().map(c=>String(c).toLowerCase());if(h.some(c=>/(amount|budget|total|cost|value|sov|scheduled)/.test(c))&&h.some(c=>/(desc|item|scope|trade|line|name|work|code|division)/.test(c))){hi=i;break}}
  // AIA G703s split headers over several rows ("SCHEDULED" / "VALUE"): join the text-only rows around the header
  const isNum=c=>typeof c==="number"||c instanceof Date||/^\(?-?\$?[\d,]+(\.\d+)?%?\)?$/.test(String(c).trim());
  const textRow=r=>r&&r.some(c=>String(c).trim())&&!r.some(c=>String(c).trim()&&isNum(c));
  let a=hi,b=hi;while(a>0&&hi-a<2&&textRow(rows[a-1]))a--;while(b+1<rows.length&&b-hi<5&&textRow(rows[b+1]))b++;
  const w=Math.max(0,...rows.slice(a,b+1).map(r=>r.length));
  const L=[];for(let c=0;c<w;c++)L.push(rows.slice(a,b+1).map(r=>String(r[c]==null?"":r[c]).trim()).filter(Boolean).join(" ").replace(/\s+/g," ").toLowerCase());
  hi=b;
  const pick=res=>{for(const re of res){const i=L.findIndex(c=>re.test(c));if(i>=0)return i}return -1};
  const cDesc=pick([/desc/,/scope|trade|work|line item|item|name/]);
  let cCode=pick([/cost ?code|^code|phase code|item ?(no|#)|division|csi/]);if(cCode===cDesc)cCode=-1;
  let cAmt=pick([/scheduled value|sov|\bscheduled\b/,/revised|current budget/,/budget/,/amount/,/^total$/,/cost/,/value/]);
  if(cAmt<0){let best=-1,bc=0;const w=Math.max(...rows.map(r=>r.length));for(let c=0;c<w;c++){const k=rows.slice(hi+1).filter(r=>num(r[c])!=null).length;if(k>bc){bc=k;best=c}}cAmt=best}
  // AIA G703 "Total completed and stored to date" (or any billed-to-date column)
  let cBilled=pick([/total completed|completed and stored|stored to date/,/billed to date|completed to date|invoiced to date/]);if(cBilled===cAmt)cBilled=-1;
  return {hi,cDesc:cDesc<0?0:cDesc,cCode,cAmt,cBilled,labels:L.map(s=>s.replace(/\b\w/g,x=>x.toUpperCase()))};
}
function budgetLinesFrom(rows,m){
  const out=[];
  for(const r of rows.slice(m.hi+1)){
    const desc=String(r[m.cDesc]==null?"":r[m.cDesc]).trim(),code=m.cCode>=0?String(r[m.cCode]==null?"":r[m.cCode]).trim():"";
    const amt=num(r[m.cAmt]);if(amt==null||amt===0||(!desc&&!code))continue;
    if(/\b(sub-?total|grand total|total)\b/i.test(desc)||/^total/i.test(code))continue;
    const l={code,desc:desc||code,amount:Math.round(amt*100)/100};
    if(m.cBilled>=0)l.billed=Math.round((num(r[m.cBilled])||0)*100)/100;
    out.push(l);
  }
  return out;
}

const TRADES=[["gc",/general cond|general req|supervis|superintend|project manag|overhead|insurance|\bbonds?\b|\bfees?\b|temporary|dumpster|portable toilet|mobiliz|clean ?up|contingenc|builder.?s risk/],["permits",/permit/],["demo",/demo/],["site",/site ?work|excavat|grading|earthwork|utilit|landscap|paving/],["concrete",/concrete|foundation|footing|slab|flatwork|masonry/],["framing",/fram|rough carp|carpentry|lumber|sheathing|truss|blocking/],["roof",/roof|gutter/],["windows",/window|door|glazing|storefront/],["plumbing",/plumb/],["electrical",/electric|lighting|low volt/],["hvac",/hvac|mechanical|heating|cooling|duct/],["insulation",/insulat/],["drywall",/drywall|gypsum|sheetrock|plaster/],["tile",/\btile|backsplash/],["flooring",/floor|carpet|\blvp\b|hardwood|vinyl plank/],["cabinets",/cabinet|millwork|casework|vanit/],["counters",/counter|quartz|granite|solid surface|\bstone\b/],["finishcarp",/finish carp|trim carp|molding|moulding|baseboard|casing/],["paint",/paint|coating|wallcover|\bstain/],["fixtures",/fixture|trim-?out|appliance|hardware/],["inspection",/inspect/],["punch",/punch|closeout|close-out|final clean/]];
const DIV={"01":["gc"],"02":["demo","site"],"03":["concrete"],"04":["concrete"],"06":["framing","finishcarp","cabinets"],"07":["insulation","roof"],"08":["windows"],"09":["drywall","tile","flooring","paint"],"10":["fixtures"],"11":["fixtures"],"12":["cabinets","counters"],"22":["plumbing"],"23":["hvac"],"26":["electrical"],"31":["site"],"32":["site"]};
const STOP=new Set(["and","the","with","for","from","work","labor","material","materials","install","installation","supply","allowance","misc","other","each","per"]);
const words=t=>new Set(String(t).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=4&&!STOP.has(w)).map(w=>w.replace(/(ing|es|s)$/,"")));
const tradesOf=t=>{const s=String(t).toLowerCase();return new Set(TRADES.filter(x=>x[1].test(s)).map(x=>x[0]))};
function autoMatch(line){
  if(/profit|overhead|markup|mark-up|\bfee\b|\boh ?& ?p\b|\bohp\b/i.test(line.desc))return {method:"markup",itemId:null,match:"auto"};
  let lt=tradesOf(line.desc);
  if(!lt.size){const m=String(line.code||"").match(/^(\d{2})(?:[\s.\-]\d|\d{4}\b|$)/);if(m&&DIV[m[1]])lt=new Set(DIV[m[1]])}
  if(lt.size===1&&lt.has("gc"))return {method:"project",itemId:null,match:"auto"};
  const lw=words(line.desc);let best=null,bs=0;
  for(const it of S.items){
    const tx=it.name+" "+(it.category||"");const it_t=tradesOf(tx),iw=words(tx);let sc=0;
    const cat_t=tradesOf(it.kind==="phase"?it.name:(it.category||""));
    lt.forEach(k=>{if(it_t.has(k))sc+=3;if(cat_t.has(k))sc+=1});lw.forEach(w=>{if(iw.has(w))sc+=1});
    if(!sc)continue;if(it.kind==="phase")sc+=.5;if(it.kind==="milestone")sc-=1;
    if(/procure|deliver/i.test(it.category||"")||/^order\b/i.test(it.name||""))sc-=/order|deposit|procure|deliver|material/i.test(line.desc)?0:2;
    if(sc>bs){bs=sc;best=it}
  }
  if(best&&bs>=2)return {method:"item",itemId:best.id,match:"auto"};
  if(lt.has("gc"))return {method:"project",itemId:null,match:"auto"};
  return {method:"project",itemId:null,match:"none"};
}
const budgetLines=()=>(S.budget&&Array.isArray(S.budget.lines))?S.budget.lines:[];

/* ---------- billing forecast ---------- */
function projectSpan(base){
  const p=project()||{};const ps=dn(p.startDate),pe=dn(p.endDate);const ss=[],ee=[];
  S.items.forEach(i=>{const x=info(i);const a=base?(x.bs!=null?x.bs:x.s):x.s,b=base?(x.be!=null?x.be:x.e):x.e;if(a!=null)ss.push(a);if(b!=null)ee.push(b)});
  let s=ps!=null?ps:(ss.length?Math.min(...ss):null),e=pe!=null?pe:(ee.length?Math.max(...ee):null);
  if(!base&&e!=null&&ee.length)e=Math.max(e,Math.max(...ee)); // general conditions run as long as the work does
  if(s!=null&&e==null)e=s;if(e!=null&&s==null)s=e;if(s!=null&&e<s)e=s;
  return {s,e};
}
function billingFactor(){
  const p=project()||{};const tot=budgetLines().filter(l=>l.method!=="exclude").reduce((a,l)=>a+(Number(l.amount)||0),0);
  // billing follows the budget lines exactly; it is never scaled up to the contract value
  const cv=Number(p.contractValue)||0;return {tot,cv,f:1};
}
const hasBilled=()=>!!(S.budget&&S.budget.billedCol);
const lineValue=(l,f)=>l.method==="exclude"?0:(Number(l.amount)||0)*f;
function lineSpan(l,base,span){
  if(l.method==="item"){const it=S.items.find(i=>i.id===l.itemId);if(it){const x=info(it);const a=base?(x.bs!=null?x.bs:x.s):x.s;let b=base?(x.be!=null?x.be:x.e):x.e;if(it.kind==="milestone")b=a;if(a!=null)return {s:a,e:b!=null?b:a}}}
  if(l.method==="start"&&span.s!=null)return {s:span.s,e:span.s};
  if(l.method==="end"&&span.e!=null)return {s:span.e,e:span.e};
  return span.s!=null?span:null;
}
function spreadInto(map,s,e,amt){ // straight-line over the project's working days
  const days=[];for(let n=s;n<=e;n++){if(isWork(n))days.push(n)}if(!days.length)for(let n=s;n<=e;n++)days.push(n);
  const per=amt/days.length;for(const n of days){const k=monthKey(n);map[k]=(map[k]||0)+per}
}
function forecast(base,plain){
  // plain = the plan alone, ignoring what's already been billed (used for planned value)
  // Returns monthly billing. Costs: the billed part sits on past days of each line's dates, the balance to finish
  // is spread from today on. Profit/overhead (method "markup") follows each month's costs at the budget's markup rate.
  const {f,cv}=billingFactor();const span=projectSpan(base);const map={},mk={},bmap={};let unplaced=0,billed=0;
  const lines=budgetLines(),hb=plain?false:hasBilled(),last=TODAY-1;
  if(!lines.length){if(cv>0&&span.s!=null)spreadInto(map,span.s,span.e,cv);else unplaced=cv;return {map,mk,bmap,unplaced,billed,rate:0}}
  const costB={},costF={},mkB={};let costTot=0;
  // pay applications on file: each line's per-application amounts land in the month the application was sent
  const apps=(S.budget&&Array.isArray(S.budget.apps))?S.budget.apps.map(a=>dn(a.date)):[];
  const placeHist=(dst,l)=>{let t=0;if(!apps.length||!Array.isArray(l.hist))return 0;l.hist.forEach((x,i)=>{const n=apps[i];if(n!=null&&x){dst[monthKey(n)]=(dst[monthKey(n)]||0)+x;t+=x}});return t};
  for(const l of lines){
    if(l.method==="exclude"||l.method==="markup")continue;const v=lineValue(l,f);if(!v)continue;costTot+=v;
    const b=hb?Math.min(v,Math.max(0,Number(l.billed)||0)):0,rem=v-b;billed+=b;
    const sp=lineSpan(l,base,span);
    if(b>0.005&&!placeHist(costB,l)){if(sp&&sp.s<=last)spreadInto(costB,sp.s,Math.min(sp.e,last),b);else spreadInto(costB,last,last,b)}
    if(rem>0.005){if(!sp){unplaced+=rem;continue}let s=sp.s,e=sp.e;if(hb){if(e<TODAY)s=e=TODAY;else if(s<TODAY)s=TODAY}spreadInto(costF,s,e,rem)}
  }
  const mlines=lines.filter(l=>l.method==="markup");
  const M=mlines.reduce((a,l)=>a+lineValue(l,f),0),Mb=hb?mlines.reduce((a,l)=>a+Math.min(lineValue(l,f),Math.max(0,Number(l.billed)||0)),0):0;
  billed+=Mb;
  const share=(dst,src,amt,fallback)=>{const tot=Object.values(src).reduce((a,v)=>a+v,0);if(amt<=0.005)return;
    if(tot>0)for(const k in src)dst[k]=(dst[k]||0)+amt*src[k]/tot;else if(fallback)spreadInto(dst,fallback.s,fallback.e,amt);else unplaced+=amt};
  // billed profit: as invoiced on each application when known, otherwise in step with billed costs
  let placed=0;if(hb)for(const l of mlines)placed+=placeHist(mkB,l);
  share(mkB,costB,Mb-placed,{s:last,e:last});
  share(mk,costF,M-Mb,span.s!=null?{s:Math.max(span.s,hb?TODAY:span.s),e:Math.max(span.e,TODAY)}:null);
  for(const k in mkB)mk[k]=(mk[k]||0)+mkB[k];
  for(const src of [costB,costF,mk])for(const k in src)map[k]=(map[k]||0)+src[k];
  for(const src of [costB,mkB])for(const k in src)bmap[k]=(bmap[k]||0)+src[k];
  return {map,mk,bmap,unplaced,billed,rate:costTot?M/costTot:0};
}
function earnedToDate(){
  const {f,cv}=billingFactor();const span=projectSpan(false);const lines=budgetLines();
  const tf=(s,e)=>s==null||TODAY<s?0:TODAY>=e?1:(TODAY-s+1)/(e-s+1);
  if(!lines.length)return cv*tf(span.s,span.e);
  // with a pay application on file, earned to date is the AIA's "total completed and stored to date"
  if(hasBilled())return lines.filter(l=>l.method!=="exclude").reduce((a,l)=>a+Math.min(lineValue(l,f),Math.max(0,Number(l.billed)||0)),0);
  let t=0,ct=0;
  for(const l of lines){const v=lineValue(l,f);if(!v||l.method==="markup")continue;ct+=v;
    if(l.method==="item"){const it=S.items.find(i=>i.id===l.itemId);if(it){t+=v*(it.status==="Complete"?100:Math.min(100,Number(it.pct)||0))/100;continue}}
    if(l.method==="start"){if(span.s!=null&&TODAY>=span.s)t+=v;continue}
    if(l.method==="end"){if(span.e!=null&&TODAY>=span.e)t+=v;continue}
    t+=v*tf(span.s,span.e)}
  // profit/overhead is earned in step with costs
  const M=lines.filter(l=>l.method==="markup").reduce((a,l)=>a+lineValue(l,f),0);
  return t+(ct?M*t/ct:0);
}
function niceScale(max){const raw=max/4;const mag=Math.pow(10,Math.floor(Math.log10(raw)));const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);return {step,top:step*Math.ceil(max/step)}}
function barPath(x,yt,w,yb){const r=Math.min(4,w/2,yb-yt);return "M"+x+","+yb+"V"+(yt+r)+"Q"+x+","+yt+" "+(x+r)+","+yt+"H"+(x+w-r)+"Q"+(x+w)+","+yt+" "+(x+w)+","+(yt+r)+"V"+yb+"Z"}
function chartSVG(keys,cur,bas){
  const n=keys.length,gw=Math.max(40,Math.min(84,Math.floor(960/n))),ml=58,mr=10,mt=12,mb=28,H=250,W=ml+mr+gw*n;
  const max=Math.max(1,...keys.map(k=>Math.max(cur[k]||0,bas[k]||0)));const {step,top}=niceScale(max);
  const y=v=>mt+(H-mt-mb)*(1-v/top),yb=y(0),bw=Math.max(6,Math.min(16,(gw-14)/2)),thisK=monthKey(TODAY);
  let g="";
  for(let v=0;v<=top+step/2;v+=step)g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--grid)"/><text x="'+(ml-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">'+moneyK(v)+"</text>";
  const every=Math.ceil(n/16);

    if(vb>0)g+='<path d="'+barPath(cx-bw-1+.75,y(vb),bw-1.5,yb)+'" fill="none" stroke="var(--muted)" stroke-width="1.5"/>';

    if(i%every===0||k===thisK)g+='<text x="'+cx+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="'+(k===thisK?"var(--accent)":"var(--muted)")+'" font-weight="'+(k===thisK?600:400)+'">'+esc(keyLabel(k))+"</text>";
    g+='<rect x="'+(ml+gw*i)+'" y="'+mt+'" width="'+gw+'" height="'+(H-mt-mb)+'" fill="transparent" data-bm="'+k+'"/>';
  });

}

async function onFile(input,kind){
  const files=input.files?[...input.files]:[];input.value="";if(!files.length)return;
  const file=files[0];
  try{
    toast("Reading "+(files.length>1?plural(files.length,"file"):file.name)+"…");
    let sheets=[];for(const fl of (kind==="budget"?[file]:files))sheets=sheets.concat(await readSheets(fl));    if(!sheets.length){toast("That file has no data.");return}
    $("drawer").dataset.sig="";
    if(kind==="budget"){
      let si=0,best=-1;sheets.forEach((s,i)=>{const m=detectBudget(s.rows);const n=budgetLinesFrom(s.rows,m).length;if(n>best){best=n;si=i}});
      openDrawer({type:"budgetImport",fileName:file.name,sheets,si,map:detectBudget(sheets[si].rows)});
    }else{
      const list=projectsFromSheets(sheets).map(p=>{const ex=S.projects.find(x=>String(x.name).toLowerCase()===p.name.toLowerCase()||String(x.plannerName||"").toLowerCase()===p.name.toLowerCase());return Object.assign(p,{existingId:ex?ex.id:null,checked:!!ex||(!!p.contract&&!/overhead/i.test(p.category))})});

    }
  }catch(e){console.error(e);toast(e&&e.message&&/Excel/.test(e.message)?e.message:"Couldn't read that file. Save it as .xlsx or .csv and try again.")}
}

function selectProject(id){
  if(S.pid===id&&unItems)return;
  S.pid=id;LS.set("pid",id);S.items=[];S.delays=[];S.entries=[];S.history=[];S.baselines=[];S.budget=null;S.itemsReady=false;lastGanttKey="";scrollMemo=null;
  if(unItems){unItems();unItems=null}if(unDelays){unDelays();unDelays=null}if(unBudget){unBudget();unBudget=null}if(unEntries){unEntries();unEntries=null}if(unHist){unHist();unHist=null}if(unBase){unBase();unBase=null}
  if(id&&S.db){
    unHist=S.db.collection("history").where("projectId","==",id).orderBy("at","desc").limit(400).onSnapshot(s=>{S.history=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(S.view==="history")renderMain();resolveNames()},e=>console.error(e));
    unBase=S.db.collection("baselines").where("projectId","==",id).onSnapshot(s=>{S.baselines=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>console.error(e));
    unEntries=S.db.collection("entries").where("projectId","==",id).onSnapshot(s=>{S.entries=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},e=>console.error(e));
    unBudget=S.db.doc("budgets/"+id).onSnapshot(s=>{S.budget=s.exists?s.data():null;render()},e=>console.error(e));
    unItems=S.db.collection("items").where("projectId","==",id).onSnapshot(s=>{S.items=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.itemsReady=true;render();resolveNames()},e=>{console.error(e);toast("Lost connection to the schedule. Reload the page.")});
    unDelays=S.db.collection("delays").where("projectId","==",id).onSnapshot(s=>{S.delays=s.docs.map(d=>Object.assign({id:d.id},d.data()));render();resolveNames()},e=>console.error(e));
  }
  render();
}
async function init(){
  render();
  const c=window.claude;
  if(!c||typeof c.use!=="function"){S.status="nodb";render();return}
  let db=null,user=null;
  try{let dl;[db,user,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads").catch(()=>null)]);DL=dl||null}catch(e){}
  S.db=db;S.user=user;
  if(!db){S.status="nodb";render();return}
  if(user){try{S.uid=await user.id()}catch(e){}try{const w=await user.can("data.write");if(w===false)S.canWrite=false}catch(e){}}
  db.collection("projects").onSnapshot(s=>{
    S.projects=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String(a.name).localeCompare(b.name));
    S.status="ready";
    if(!S.projects.find(p=>p.id===S.pid))selectProject(S.projects[0]?S.projects[0].id:null);
    else if(!unItems)selectProject(S.pid);
    else render();
  },e=>{console.error(e);S.status="nodb";render()});
}

const armed=new Set();
function confirmClick(btn,key,label,fn){
  if(armed.has(key)){armed.delete(key);fn();return}
  armed.add(key);btn.classList.add("armed");const old=btn.textContent;btn.textContent=label;
  setTimeout(()=>{if(armed.has(key)){armed.delete(key);btn.classList.remove("armed");btn.textContent=old}},4000);
}

  const ex=t.closest("[data-export]");if(ex){const f=ex.dataset.export;toast("Preparing the "+(f==="pdf"?"PDF":"Excel file")+"…");f==="pdf"?exportPDF(S.view):exportXLSX(S.view);return}
  const rv=t.closest("[data-revert]");if(rv){confirmClick(rv,"rv"+rv.dataset.revert,"Click again to restore",()=>revertHistory(rv.dataset.revert));return}
  const bu=t.closest("[data-baseuse]");if(bu){confirmClick(bu,"bu","Click again to switch",async()=>{try{await activateBaseline(bu.dataset.baseuse);toast("Baseline switched");$("drawer").dataset.sig="";renderDrawer()}catch(err){dbErr(err)}});return}
  const hd=t.closest("[data-holdel]");if(hd){S.drawer.cal.holidays=S.drawer.cal.holidays.filter(h=>h.date!==hd.dataset.holdel);renderHolidays();return}
  const en=t.closest("[data-entry]");if(en){e.stopPropagation();$("drawer").dataset.sig="";openDrawer({type:"entry",id:en.dataset.entry});return}
  const cn=t.closest("[data-calnav]");if(cn){const k=Number(cn.dataset.calnav);if(!k)S.calMonth=null;else{const [yy,mm]=(S.calMonth||monthKey(TODAY)).split("-").map(Number);const dt=new Date(Date.UTC(yy,mm-1+k,1));S.calMonth=dt.toISOString().slice(0,7)}renderToolbar();renderMain();return}
  const op=t.closest("[data-open]");if(op){const id=op.dataset.open;const it=S.items.find(i=>i.id===id);if(it){$("drawer").dataset.sig="";openDrawer({type:"item",id})}return}
  const cd=t.closest("[data-calday]");if(cd){$("drawer").dataset.sig="";openDrawer({type:"day",date:cd.dataset.calday});return}
  const od=t.closest("[data-open-delay]");if(od){$("drawer").dataset.sig="";openDrawer({type:"delay",id:od.dataset.openDelay});return}
  const pdl=t.closest("[data-preddel]");if(pdl){S.drawer.preds=S.drawer.preds.filter(x=>x.id!==pdl.dataset.preddel);renderPreds();return}
  const osd=t.closest("[data-osdel]");if(osd){S.drawer.onsite=S.drawer.onsite.filter(d=>d!==osd.dataset.osdel);renderOnsite();return}
  if(t.id==="btnProjNew"){$("drawer").dataset.sig="";openDrawer({type:"project"});return}
  if(t.id==="btnProjEdit"){$("drawer").dataset.sig="";openDrawer({type:"project",id:S.pid});return}
  if(t.id==="drawerBack"){closeDrawer();return}
  const a=t.closest("[data-act]");if(!a)return;const act=a.dataset.act;
  if(act==="close")closeDrawer();
  else if(act==="new"){$("drawer").dataset.sig="";openDrawer({type:"item",kind:a.dataset.kind})}
  else if(act==="newEntry"){$("drawer").dataset.sig="";openDrawer({type:"entry",kind:a.dataset.kind,itemId:a.dataset.item||"",date:S.view==="calendar"&&S.calMonth&&S.calMonth!==monthKey(TODAY)?S.calMonth+"-01":ds(TODAY)})}
  else if(act==="dayNew"){const date=S.drawer.date;$("drawer").dataset.sig="";if(a.dataset.kind==="task")openDrawer({type:"item",kind:"task",date});else openDrawer({type:"entry",kind:a.dataset.kind,date})}
  else if(act==="saveEntry")saveEntry();
  else if(act==="progress"){$("drawer").dataset.sig="";openDrawer({type:"progress",sd:ds(TODAY)})}
  else if(act==="applyProgress"){a.disabled=true;applyProgress()}
  else if(act==="mspImport")$("fileMsp").click();
  else if(act==="applyMsp"){a.disabled=true;applyMsp()}
  else if(act==="costUpload")$("fileCosts").click();
  else if(act==="baseSave"){const nm=val("bl_name");if(!nm){toast("Name the baseline, e.g. “After change order #2”.");$("bl_name").focus();return}a.disabled=true;saveBaseline(nm).then(()=>{toast("Baseline saved and made active");$("drawer").dataset.sig="";renderDrawer()}).catch(dbErr)}
  else if(act==="holAdd"){const dd=val("hol_d");if(!dd){toast("Pick the holiday date.");return}const nm=val("hol_n")||"Holiday";S.drawer.cal.holidays=S.drawer.cal.holidays.filter(h=>h.date!==dd).concat([{date:dd,name:nm}]);$("hol_d").value="";$("hol_n").value="";renderHolidays()}
  else if(act==="holUS"){const have=new Set(S.drawer.cal.holidays.map(h=>h.date));US_HOLIDAYS.forEach(([dd,nm])=>{if(!have.has(dd))S.drawer.cal.holidays.push({date:dd,name:nm})});renderHolidays();toast("Added US holidays. Save the project to apply them.")}
  else if(act==="delEntry")confirmClick(a,"de","Click again to delete",async()=>{try{const en0=S.entries.find(x=>x.id===S.drawer.id);await S.db.doc("entries/"+S.drawer.id).delete();if(en0){const {id:_i,...rest}=en0;await logHistory("entry","Deleted "+(en0.kind==="deadline"?"deadline":"note")+" "+en0.title,[{coll:"entries",id:en0.id,name:en0.title,before:rest,after:null}])}closeDrawer();toast("Deleted")}catch(err){dbErr(err)}});
  else if(act==="newproj"){$("drawer").dataset.sig="";openDrawer({type:"project"})}
  else if(act==="sample"){a.disabled=true;a.textContent="Loading sample…";loadSample()}
  else if(act==="logdelay"){if(!S.items.length){toast("Add items to the schedule first.");return}$("drawer").dataset.sig="";openDrawer({type:"logdelay"})}
  else if(act==="importProjects")$("fileProjects").click();
  else if(act==="budgetUpload")$("fileBudget").click();
  else if(act==="projDetails"){$("drawer").dataset.sig="";openDrawer({type:"project",id:S.pid})}
  else if(act==="applyBudget"){a.disabled=true;applyBudget()}
  else if(act==="applyProjImport"){a.disabled=true;applyProjImport()}
  else if(act==="piAll"||act==="piNone"){S.drawer.list.forEach(p=>p.checked=act==="piAll");document.querySelectorAll("[data-pi]").forEach(c=>c.checked=act==="piAll")}
  else if(act==="rematch"){saveLines(budgetLines().map(l=>l.match==="manual"?l:Object.assign({},l,autoMatch(l))));toast("Re-matched lines you haven’t set by hand")}
  else if(act==="delBudget")confirmClick(a,"db","Click again to remove",async()=>{try{await S.db.doc("budgets/"+S.pid).delete();await logHistory("budget","Removed the budget",[]);toast("Budget removed")}catch(err){dbErr(err)}});
  else if(act==="saveItem")saveItem();
  else if(act==="saveProj")saveProject();
  else if(act==="saveDelay")saveDelay(a.dataset.prefix);
  else if(act==="rebase")rebase([S.drawer.id]);
  else if(act==="rebaseAll")confirmClick(a,"rb","Click again to reset all",()=>rebase(S.items.map(i=>i.id)));
  else if(act==="delItem"){const it=S.items.find(i=>i.id===S.drawer.id);const n=it&&it.kind==="phase"?childrenOf(it.id).length:0;confirmClick(a,"di",n?"Delete phase + "+plural(n,"item")+"?":"Click again to delete",()=>deleteItem(S.drawer.id))}
  else if(act==="delProj")confirmClick(a,"dp","Click again: deletes everything",()=>deleteProject(S.drawer.id));
  else if(act==="delDelay")confirmClick(a,"dd","Click again to delete",async()=>{try{await S.db.doc("delays/"+S.drawer.id).delete();closeDrawer();toast("Entry deleted")}catch(err){dbErr(err)}});
  else if(act==="saveDelayEdit")(async()=>{const expl=val("e_expl");if(!expl){toast("Explain what caused the delay.");return}try{await S.db.doc("delays/"+S.drawer.id).update({date:val("e_date")||ds(TODAY),days:Math.max(0,Math.round(Number(val("e_days"))||0)),cause:val("e_cause"),explanation:expl});closeDrawer();toast("Entry saved")}catch(err){dbErr(err)}})();
  else if(act==="osAdd"){const v=val("os_one");if(!v){toast("Pick a date to add.");return}if(!S.drawer.onsite.includes(v))S.drawer.onsite.push(v);$("os_one").value="";renderOnsite()}
  else if(act==="osRange"||act==="osFill"){
    let a0,b0,wdOnly;
    if(act==="osFill"){a0=dn(val("f_start"));b0=dn(val("f_end"))??a0;wdOnly=true}else{a0=dn(val("os_a"));b0=dn(val("os_b"));wdOnly=$("os_wd").checked}
    if(a0==null||b0==null||b0<a0){toast(act==="osFill"?"Set the task’s start and end first.":"Pick a valid from and to date.");return}
    if(b0-a0>366){toast("That range is over a year. Pick a shorter one.");return}
    for(let n=a0;n<=b0;n++){const w=dow(n);if(wdOnly&&(w===0||w===6))continue;const s=ds(n);if(!S.drawer.onsite.includes(s))S.drawer.onsite.push(s)}
    renderOnsite();
  }
  else if(act==="osClear"){S.drawer.onsite=[];renderOnsite()}
  else if(act==="predAdd"){const v=val("predAdd");if(!v){toast("Pick the item this depends on.");return}if(!S.drawer.preds.some(l=>l.id===v))S.drawer.preds.push({id:v,type:"FS",lag:0});renderPreds()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.drawer){closeDrawer();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("grow")&&e.target.dataset.open){e.preventDefault();e.target.click()}
});
document.addEventListener("submit",e=>e.preventDefault());
document.addEventListener("change",e=>{
  if(e.target.id==="projSel")selectProject(e.target.value);
  if(e.target.id==="onlyIssues"){S.onlyIssues=e.target.checked;renderMain()}
  const id=e.target.id,d=S.drawer;
  if(id==="fileBudget")onFile(e.target,"budget");
  if(id==="fileProjects")onFile(e.target,"projects");
  if(d&&d.type==="budgetImport"&&/^bi_/.test(id)){
    const v=Number(e.target.value);
    if(id==="bi_sheet"){d.si=v;d.map=detectBudget(d.sheets[v].rows)}
    else if(id==="bi_hdr"){const m2=detectBudget(d.sheets[d.si].rows.slice(v));d.map=Object.assign({},m2,{hi:v+m2.hi})}
    else d.map[{bi_desc:"cDesc",bi_code:"cCode",bi_amt:"cAmt",bi_billed:"cBilled"}[id]]=v;
    $("drawer").dataset.sig="";renderDrawer();
  }
  if(e.target.dataset&&e.target.dataset.pi!=null&&d&&d.list)d.list[Number(e.target.dataset.pi)].checked=e.target.checked;
  if(e.target.classList.contains("bl-sel")){
    const v=e.target.value,lid=e.target.dataset.line;
    saveLines(budgetLines().map(l=>l.id!==lid?l:Object.assign({},l,v.startsWith("i:")?{method:"item",itemId:v.slice(2),match:"manual"}:{method:v.slice(2),itemId:null,match:"manual"})));
  }
  if(id==="billReview"){S.billReview=e.target.checked;renderMain()}
  if(e.target.dataset&&e.target.dataset.ptype!=null&&d&&d.preds){d.preds[Number(e.target.dataset.ptype)].type=e.target.value;renderPreds()}
  if(e.target.dataset&&e.target.dataset.plag!=null&&d&&d.preds){d.preds[Number(e.target.dataset.plag)].lag=Math.round(Number(e.target.value)||0);renderPreds()}
  if(["f_start","f_end","f_cal","f_cons","f_cons_date"].includes(id)&&d&&d.type==="item")renderPreds();
  if(id==="showCrit"){S.showCrit=e.target.checked;LS.set("showCrit",S.showCrit);renderMain()}
  if(id==="fileMsp")onMspFile(e.target);
  if(id==="fileCosts")onCostFile(e.target);
  if(id==="pg_sd"&&d&&d.type==="progress"){d.sd=e.target.value;$("drawer").dataset.sig="";renderDrawer()}
  if(id==="calPhases"){S.calPhases=e.target.checked;LS.set("calPhases",S.calPhases);renderMain()}
  if(id==="en_kind"){const w=$("en_doneWrap");if(w)w.hidden=e.target.value!=="deadline"}
  if((id==="bill_ret"||id==="bill_scale")&&S.pid){
    const up=id==="bill_ret"?{retainagePct:Math.max(0,Math.min(25,num(e.target.value)||0))}:{scaleToContract:e.target.checked};
    S.db.doc("projects/"+S.pid).update(up).catch(dbErr);
  }
});
let qT;document.addEventListener("input",e=>{if(e.target.id==="q"){clearTimeout(qT);const v=e.target.value;qT=setTimeout(()=>{S.q=v.trim();renderMain()},150)}});

init();
})();
</script>
