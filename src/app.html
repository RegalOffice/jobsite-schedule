<title>Jobsite Schedule Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: job header + KPI strip, then tabbed work surface (Gantt / list / delay log / look-ahead); editing happens in a right-side drawer. */
:root{
  --bg:#eceff1; --panel:#ffffff; --panel-2:#f6f8f9; --ink:#1b2126; --muted:#5b6670; --line:#d3d9de;
  --accent:#e2550b; --accent-soft:#fde6d8; --accent-ink:#ffffff;
  --steel:#3a6688; --bar:#9eabb6; --base:#c3ccd3; --good:#2c8a57; --warn:#b97f00; --bad:#c62828; --bad-soft:#fbe3e3; --warn-soft:#fbf0d6; --good-soft:#dff2e7;
  --wknd:#f0f2f4; --grid:#e3e7ea; --shadow:0 12px 40px rgba(20,30,40,.18);
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --lw:250px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161a; --panel:#1a2025; --panel-2:#161b20; --ink:#e4e9ed; --muted:#98a4ae; --line:#2c353d;
  --accent:#ff7a33; --accent-soft:#3a2418; --accent-ink:#1a0d05;
  --steel:#6a9dc6; --bar:#5a6874; --base:#36414a; --good:#4cc488; --warn:#e2ac36; --bad:#ff6b6b; --bad-soft:#3a1d1f; --warn-soft:#352b14; --good-soft:#163024;
  --wknd:#161b1f; --grid:#232b31; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161a; --panel:#1a2025; --panel-2:#161b20; --ink:#e4e9ed; --muted:#98a4ae; --line:#2c353d;
  --accent:#ff7a33; --accent-soft:#3a2418; --accent-ink:#1a0d05;
  --steel:#6a9dc6; --bar:#5a6874; --base:#36414a; --good:#4cc488; --warn:#e2ac36; --bad:#ff6b6b; --bad-soft:#3a1d1f; --warn-soft:#352b14; --good-soft:#163024;
  --wknd:#161b1f; --grid:#232b31; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:1500px;margin:0 auto;padding-inline:20px;padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
@media (max-width:600px){.app{padding-inline:16px}:root{--lw:150px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between}
.brand{display:flex;gap:14px;align-items:flex-start;min-width:0}
.mark{flex:none;width:12px;align-self:stretch;min-height:52px;background:repeating-linear-gradient(-45deg,var(--accent) 0 7px,var(--ink) 7px 14px);border-radius:2px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.05;margin:2px 0 4px;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px}
.projctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
#projSel{max-width:260px;font-weight:600}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 12px;min-height:36px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--panel)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{min-height:30px;padding:4px 9px;font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.kpi{background:var(--panel);padding:12px 14px;min-width:0}
.kpi .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;margin-top:2px}
.kpi .d{font-size:13px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)} .kpi.warn .v{color:var(--warn)}

/* tabs + toolbar */
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;padding:9px 14px;font-family:var(--f-display);font-size:19px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-family:var(--f-mono);font-size:12px;background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .spacer{flex:1 1 20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
#q{width:200px}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.empty{padding:40px 24px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-family:var(--f-display);font-size:26px;color:var(--ink);margin:0}
.empty p{max-width:56ch;margin:0}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* gantt */
.gwrap{overflow:auto;max-height:72vh;border-radius:8px;position:relative}
.ghead,.grow{display:flex;min-width:max-content}
.ghead{position:sticky;top:0;z-index:4;background:var(--panel);border-bottom:1px solid var(--line)}
.glabel{position:sticky;left:0;z-index:3;width:var(--lw);flex:none;background:var(--panel);border-right:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:6px;min-width:0}
.ghead .glabel{z-index:5;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.gtrack{position:relative;flex:none}
.ghead .gtrack{height:46px}
.mlab{position:absolute;top:4px;font-family:var(--f-display);font-weight:600;font-size:15px;padding-left:4px;border-left:1px solid var(--line);height:42px;white-space:nowrap}
.tlab{position:absolute;bottom:3px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:center}
.grow{height:36px;border-bottom:1px solid var(--grid);cursor:pointer}
.grow:hover .glabel,.grow:hover .gtrack{background-color:var(--panel-2)}
.grow.phase{height:38px}
.grow.phase .glabel{font-weight:700;font-family:var(--f-display);font-size:17px;letter-spacing:.01em}
.grow.task .glabel{padding-left:28px}
.glabel .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.glabel .sb{display:block;font-size:12px;color:var(--muted);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-body)}
.caret{border:0;background:none;cursor:pointer;width:18px;height:18px;padding:0;color:var(--muted);flex:none;transition:transform .15s}
.caret.closed{transform:rotate(-90deg)}
.flag{flex:none;font-family:var(--f-mono);font-size:11px;font-weight:500;border-radius:4px;padding:1px 5px}
.flag.bad{background:var(--bad-soft);color:var(--bad)} .flag.warn{background:var(--warn-soft);color:var(--warn)}
.bar{position:absolute;top:9px;height:16px;border-radius:3px;background:var(--bar);overflow:hidden}
.bar .pf{position:absolute;inset:0 auto 0 0;background:rgba(0,0,0,.22)}
.bar.st-prog{background:var(--steel)} .bar.st-done{background:var(--good)} .bar.st-hold{background:var(--warn)}
.bar.late{box-shadow:0 0 0 2px var(--bad)}
.grow.phase .bar{top:12px;height:12px;background:var(--ink);border-radius:1px}
.grow.phase .bar.st-done{background:var(--good)}
.bl{position:absolute;top:27px;height:4px;border-radius:2px;background:var(--base)}
.grow.phase .bl{top:27px}
.ms{position:absolute;top:10px;width:15px;height:15px;transform:rotate(45deg);background:var(--steel);border-radius:2px}
.ms.st-done{background:var(--good)} .ms.late{box-shadow:0 0 0 2px var(--bad)}
.ms.bl-ms{background:transparent;border:2px solid var(--base);top:12px;width:11px;height:11px}
.os{position:absolute;bottom:3px;height:5px;background:var(--accent);border-radius:1px}
.slipt{position:absolute;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--bad);font-weight:500;white-space:nowrap}
.glinks{position:absolute;top:0;pointer-events:none;z-index:1;overflow:visible}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2;pointer-events:none}
.today-lab{position:absolute;top:0;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-size:10px;font-weight:600;padding:0 4px;border-radius:2px;text-transform:uppercase;letter-spacing:.06em;z-index:3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:18px;height:9px;border-radius:2px}

/* list table */
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel-2)}
tr.ph td{background:var(--panel-2);font-family:var(--f-display);font-weight:700;font-size:16px}
td.num,th.num{text-align:right}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:10px;padding:2px 8px;white-space:nowrap}
.pill.ns{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.prog{background:color-mix(in srgb,var(--steel) 18%,transparent);color:var(--steel)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.hold{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.dim{color:var(--muted)}
.bad-t{color:var(--bad);font-weight:600} .good-t{color:var(--good)}

/* delays */
.dgrid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.ph-h{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cause{padding:8px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.cause .track{grid-column:1/-1;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.cause .fill{height:100%;background:var(--bad);border-radius:4px}
.expl{max-width:60ch;white-space:pre-wrap}
.callout{margin:12px 14px;padding:10px 12px;border-radius:6px;background:var(--warn-soft);color:var(--ink);font-size:14px;border-left:3px solid var(--warn)}

/* look-ahead */
.weeks{display:flex;flex-direction:column;gap:14px;padding:14px}
.wk h3{font-family:var(--f-display);font-size:18px;margin:0 0 6px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.day{background:var(--panel);min-height:96px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.day.we{background:var(--wknd)}
.day.td{box-shadow:inset 0 3px 0 var(--accent)}
.day .dn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.day.td .dn{color:var(--accent);font-weight:500}
.chip{font-size:12.5px;line-height:1.25;border-radius:4px;padding:3px 6px;cursor:pointer;overflow-wrap:anywhere;border:0;text-align:left}
.chip.on{background:var(--accent-soft);color:var(--ink);border-left:3px solid var(--accent)}
.chip.ms{background:color-mix(in srgb,var(--steel) 16%,transparent);border-left:3px solid var(--steel)}
.chip.se{background:var(--panel-2);color:var(--muted);border-left:3px solid var(--bar)}
@media (max-width:760px){.days{grid-template-columns:minmax(0,1fr)}.day{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center}.day .dn{width:80px}.day.emptyday{display:none}}

/* drawer */
#drawerBack{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.dh{padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h2{font-family:var(--f-display);font-size:24px;margin:0;line-height:1.1}
.db{padding:16px 18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:14px}
.df{padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>label,.lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fld input,.fld select{width:100%}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sect{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sect h3{font-family:var(--f-display);font-size:18px;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{font-size:13px;color:var(--muted)}
.dates{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:inline-flex;align-items:center;gap:4px;background:var(--accent-soft);border-radius:4px;padding:3px 4px 3px 8px;font-family:var(--f-mono);font-size:12.5px}
.dchip.past{opacity:.6}
.dchip button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:15px;line-height:1;padding:0 4px}
.inl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dur{display:flex;gap:6px}
.dur input{width:80px}
.radio{display:flex;flex-direction:column;gap:6px;font-size:14px}
.radio label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.dlog{display:flex;flex-direction:column;gap:8px}
.dlog .e{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:14px}
.dlog .e .t{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.base-box{background:var(--panel-2);border-radius:6px;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:9px 16px;border-radius:6px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
#toast.show{opacity:1}
.banner{padding:10px 14px;border-radius:6px;background:var(--panel-2);border:1px solid var(--line);font-size:14px;color:var(--muted)}
/* scheduling extras */
.bar.crit{background:var(--bad)}
.grow.phase .bar.crit{background:var(--bad)}
.ms.crit{background:var(--bad)}
.hol{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 22%,transparent) 0 3px,transparent 3px 7px)}
.sw.hatch{background:repeating-linear-gradient(135deg,var(--muted) 0 2px,transparent 2px 5px)}
.dchip.lk{flex-wrap:wrap;gap:6px;padding:4px 4px 4px 8px;font-family:var(--f-body)}
.dchip.lk select{min-height:26px;padding:2px 4px;font-size:12px}
.dchip.lk input{width:52px;min-height:26px;padding:2px 4px;font-size:12px}
.lagl{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted)}
.chip.hol{background:transparent;border:1px dashed var(--muted);color:var(--muted);cursor:default}
.cal-day.holday{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 12%,transparent) 0 3px,transparent 3px 8px)}
.chk-row{display:flex;flex-wrap:wrap;gap:6px 14px}
.hist-day{font-family:var(--f-display);font-size:17px;font-weight:700;padding:12px 14px 4px}
.hist{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:4px 12px;padding:9px 14px;border-top:1px solid var(--grid);align-items:start}
.hist .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.hist details{font-size:13px;color:var(--muted);margin-top:2px}
.hist ul{margin:6px 0 0;padding-left:18px}
.act-tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-right:6px}
.ev-note{padding:10px 14px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
/* calendar */
.calwrap{overflow-x:auto}
.cal{min-width:760px}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cal-head div{padding:7px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.cal-week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.cal-week:last-child{border-bottom:0}
.cal-day{border-right:1px solid var(--grid);min-height:112px;padding:4px 4px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal-day:last-child{border-right:0}
.cal-day:hover{background:var(--panel-2)}
.cal-day.we{background:var(--wknd)}
.cal-day.out .cal-dn{opacity:.45}
.cal-dn{font-family:var(--f-mono);font-size:12px;color:var(--muted);align-self:flex-start;height:20px;line-height:20px;padding:0 4px}
.cal-day.td .cal-dn{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-weight:500}
.cal-lanes{flex:none}
.cal-bar{position:absolute;height:19px;line-height:19px;border:0;border-left:3px solid var(--bar);border-radius:3px;background:color-mix(in srgb,var(--bar) 24%,var(--panel));color:var(--ink);font-size:12px;padding:0 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1}
.cal-bar.st-prog{border-left-color:var(--steel);background:color-mix(in srgb,var(--steel) 22%,var(--panel))}
.cal-bar.st-done{border-left-color:var(--good);background:color-mix(in srgb,var(--good) 20%,var(--panel))}
.cal-bar.st-hold{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--panel))}
.cal-bar.late{box-shadow:inset 0 0 0 1px var(--bad)}
.cal-bar.ph{font-weight:700;background:color-mix(in srgb,var(--ink) 12%,var(--panel));border-left-color:var(--ink)}
.chip.dl{background:var(--panel-2);border-left:3px solid var(--ink);color:var(--ink);font-weight:600}
.chip.dl.missed,.chip.dl.overdue{background:var(--bad-soft);border-left-color:var(--bad);color:var(--bad)}
.chip.dl.done{background:var(--good-soft);border-left-color:var(--good);color:var(--good);text-decoration:line-through}
.chip.nt{background:var(--warn-soft);border-left:3px solid var(--warn);color:var(--ink)}
.dlm{position:absolute;top:5px;bottom:5px;width:2px;background:var(--ink);cursor:pointer;z-index:2}
.dlm::after{content:"";position:absolute;top:0;left:2px;border-left:8px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;color:var(--ink)}
.dlm.missed,.dlm.overdue{background:var(--bad)}.dlm.missed::after,.dlm.overdue::after{color:var(--bad)}
.dlm.done{background:var(--good)}.dlm.done::after{color:var(--good)}
.ntm{position:absolute;top:11px;width:12px;height:12px;border-radius:2px;background:var(--warn);cursor:pointer;z-index:2;transform:translateX(-6px)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;overflow:hidden}
.clegend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 14px 0;font-size:13px;color:var(--muted);align-items:center}
.swc{display:inline-block;width:12px;height:12px;background:var(--steel);border-radius:2px 2px 0 0;vertical-align:-1px;margin-right:6px}
.swh{display:inline-block;width:12px;height:12px;border:1.5px solid var(--muted);border-bottom:0;border-radius:2px 2px 0 0;vertical-align:-1px;margin-right:6px}

.ctip{position:fixed;z-index:40;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:8px 10px;font-size:13px;pointer-events:none;min-width:200px}
.ctip .r{display:flex;justify-content:space-between;gap:14px}
.ctip .h{font-weight:600;margin-bottom:4px}
.bl-sel{max-width:300px;min-height:32px;padding:4px 6px;font-size:13px}
.mchip{font-size:11.5px;font-weight:600;border-radius:9px;padding:1px 7px;white-space:nowrap;display:inline-block}
.mchip.auto{background:color-mix(in srgb,var(--steel) 16%,transparent);color:var(--steel)}
.mchip.manual{background:var(--good-soft);color:var(--good)}
.mchip.none{background:var(--warn-soft);color:var(--warn)}
tr.past td{color:var(--muted)}
tr.nowm td{font-weight:600}
tfoot td{font-weight:600;border-top:1px solid var(--line);border-bottom:0}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const DAY=86400000;
const STATUSES=["Not started","In progress","Complete","On hold"];
const CATEGORIES=["Preconstruction","Permits","Procurement","Delivery","Sitework","Demolition","Foundation","Rough Carpentry","Framing","Roofing","Windows & Doors","Plumbing Rough-in","Electrical Rough-in","HVAC Rough-in","Inspection","Insulation","Drywall","Tile","Flooring","Cabinets","Countertops","Finish Carpentry","Paint","Fixtures & Trim-out","Installation","Punch List","Closeout","Other"];
const CAUSES=["Weather","Material backorder","Late delivery","Subcontractor no-show","Subcontractor availability","Owner change order","Owner selection pending","Design / RFI","Inspection or permit","Unforeseen site conditions","Labor shortage","Predecessor work late","Damaged material / rework","Other"];
const KIND_LABEL={phase:"Phase",task:"Task",milestone:"Milestone / delivery"};

/* ---------- date helpers (dates stored as YYYY-MM-DD, math in whole UTC days) ---------- */
const dn=s=>{if(!s||typeof s!=="string")return null;const t=Date.parse(s+"T00:00:00Z");return isNaN(t)?null:Math.round(t/DAY)};
const ds=n=>new Date(n*DAY).toISOString().slice(0,10);
const TODAY=(()=>{const d=new Date();return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)})();
const dow=n=>new Date(n*DAY).getUTCDay();
const monday=n=>n-((dow(n)+6)%7);
const fmt=(n,o)=>n==null?"—":new Date(n*DAY).toLocaleDateString(undefined,Object.assign({month:"short",day:"numeric",timeZone:"UTC"},o||{}));
const fmtY=n=>fmt(n,{year:"numeric"});
const fmtW=n=>fmt(n,{weekday:"short"});
const plural=(n,w)=>n+" "+w+(Math.abs(n)===1?"":"s");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const LS={get(k,d){try{const v=localStorage.getItem("jsb."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("jsb."+k,JSON.stringify(v))}catch(e){}}};
const S={db:null,user:null,uid:null,canWrite:true,status:"loading",projects:[],pid:LS.get("pid",null),items:[],delays:[],itemsReady:false,
  view:LS.get("view","gantt"),zoom:LS.get("zoom","week"),q:"",onlyIssues:false,collapsed:LS.get("collapsed",{}),ahead:LS.get("ahead",3),names:{},drawer:null,budget:null,billReview:false,entries:[],calMonth:null,calPhases:LS.get("calPhases",false),history:[],baselines:[],showCrit:LS.get("showCrit",false),float:null,billCache:null};
let unItems=null,unDelays=null,unBudget=null,unEntries=null,unHist=null,unBase=null;
const $=id=>document.getElementById(id);

function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),2600)}
function dbErr(e){const c=e&&e.code;if(c==="invalid_argument"){S.canWrite=false;toast("You have view-only access to this schedule.");render()}else if(c==="quota_exceeded")toast("Storage is full. Delete old projects to make room.");else toast("Couldn't save. Check your connection and try again.");console.error(e)}

/* ---------- derived data ---------- */
const project=()=>S.projects.find(p=>p.id===S.pid)||null;
const phases=()=>S.items.filter(i=>i.kind==="phase").sort((a,b)=>(spanOf(a).s??1e9)-(spanOf(b).s??1e9)||String(a.name).localeCompare(b.name));
const childrenOf=pid=>S.items.filter(i=>i.kind!=="phase"&&i.phaseId===pid).sort((a,b)=>(dn(a.start)??1e9)-(dn(b.start)??1e9)||String(a.name).localeCompare(b.name));
const orphans=()=>{const ids=new Set(S.items.filter(i=>i.kind==="phase").map(i=>i.id));return S.items.filter(i=>i.kind!=="phase"&&!ids.has(i.phaseId)).sort((a,b)=>(dn(a.start)??1e9)-(dn(b.start)??1e9))};
function spanOf(it){
  let s=dn(it.start),e=it.kind==="milestone"?dn(it.start):dn(it.end);
  if(it.kind==="phase"&&(s==null||e==null)){const k=childrenOf(it.id);const ss=k.map(x=>dn(x.start)).filter(x=>x!=null),ee=k.map(x=>x.kind==="milestone"?dn(x.start):dn(x.end)).filter(x=>x!=null);if(s==null&&ss.length)s=Math.min(...ss);if(e==null&&ee.length)e=Math.max(...ee)}
  if(s!=null&&e==null)e=s;if(e!=null&&s==null)s=e;
  return {s,e};
}
function info(it){
  const {s,e}=spanOf(it);
  const bs=dn(it.baseStart),be=it.kind==="milestone"?dn(it.baseStart):dn(it.baseEnd);
  const slip=(be!=null&&e!=null)?e-be:0;
  const done=it.status==="Complete";
  const late=!done&&e!=null&&TODAY>e;
  const logged=S.delays.filter(d=>d.itemId===it.id).reduce((a,d)=>a+(Number(d.days)||0),0);
  const unexplained=Math.max(0,slip-Math.max(0,logged));
  return {s,e,bs,be,slip,done,late,logged,unexplained,issue:slip>0||late};
}
function statusPill(it,inf){
  if(inf.late)return '<span class="pill late">Late</span>';
  const m={"Not started":"ns","In progress":"prog","Complete":"done","On hold":"hold"};
  return '<span class="pill '+(m[it.status]||"ns")+'">'+esc(it.status||"Not started")+"</span>";
}
const stClass=it=>({"In progress":"st-prog","Complete":"st-done","On hold":"st-hold"}[it.status]||"");
function matches(it){
  if(S.onlyIssues&&!info(it).issue)return false;
  if(!S.q)return true;
  const q=S.q.toLowerCase();
  return [it.name,it.sub,it.category,it.contact,it.notes].some(v=>v&&String(v).toLowerCase().includes(q));
}
/* rows in schedule order: phase then its items; respects filter + collapse */
function orderedRows(respectCollapse){
  const out=[];const filtering=S.q||S.onlyIssues;
  for(const ph of phases()){
    const kids=childrenOf(ph.id).filter(matches);
    if(filtering&&!matches(ph)&&!kids.length)continue;
    out.push({it:ph,lvl:0});
    if(respectCollapse&&S.collapsed[ph.id]&&!filtering)continue;
    kids.forEach(k=>out.push({it:k,lvl:1}));
  }
  const o=orphans().filter(matches);
  if(o.length){out.push({group:"Unassigned items"});o.forEach(k=>out.push({it:k,lvl:1}))}
  return out;
}
function summary(){
  const its=S.items;
  const ends=its.map(i=>spanOf(i).e).filter(x=>x!=null),bends=its.map(i=>i.kind==="milestone"?dn(i.baseStart):dn(i.baseEnd)).filter(x=>x!=null);
  const starts=its.map(i=>spanOf(i).s).filter(x=>x!=null);
  const fin=ends.length?Math.max(...ends):null,bfin=bends.length?Math.max(...bends):null,st=starts.length?Math.min(...starts):null;
  const work=its.filter(i=>i.kind==="task");const pool=work.length?work:its.filter(i=>i.kind==="phase");
  let tw=0,dw=0;pool.forEach(i=>{const {s,e}=spanOf(i);const w=(s!=null&&e!=null)?Math.max(1,e-s+1):1;tw+=w;dw+=w*(i.status==="Complete"?100:Math.min(100,Math.max(0,Number(i.pct)||0)))/100});
  const infos=its.map(i=>[i,info(i)]);
  const late=infos.filter(([i,x])=>x.late).length,slipped=infos.filter(([i,x])=>x.slip>0).length,unexp=infos.filter(([i,x])=>x.unexplained>0).length;
  const wk0=monday(TODAY),wk1=wk0+6;let onsite=0;const subs=new Set();
  its.forEach(i=>(i.onsite||[]).forEach(d=>{const n=dn(d);if(n!=null&&n>=wk0&&n<=wk1){onsite++;subs.add(i.sub||i.name)}}));
  const ddays=S.delays.reduce((a,d)=>a+(Number(d.days)||0),0);
  return {fin,bfin,st,pct:tw?Math.round(dw/tw*100):0,late,slipped,unexp,onsiteSubs:subs.size,onsite,ddays,dcount:S.delays.length};
}

/* ---------- render ---------- */
function render(){loadCalendar();S.float=scheduleFloat();renderHeader();renderSummary();renderTabs();renderToolbar();renderMain();if(S.drawer)renderDrawer()}
function renderHeader(){
  const p=project();
  $("projTitle").textContent=p?p.name:"Jobsite Schedule Board";
  const m=[];
  if(p){if(p.number)m.push("Job #"+esc(p.number));if(Number(p.contractValue)>0)m.push("Contract "+money(Number(p.contractValue)));
    if(p.startDate||p.endDate)m.push(fmtY(dn(p.startDate))+" – "+fmtY(dn(p.endDate)));if(p.address)m.push(esc(p.address));if(p.client)m.push("Client: "+esc(p.client));if(p.super)m.push("Super: "+esc(p.super));
    if(p.targetFinish)m.push("Contract finish "+fmtY(dn(p.targetFinish)))}
  else if(S.status==="ready")m.push("Create a project to start scheduling.");
  $("projMeta").innerHTML=m.map(x=>"<span>"+x+"</span>").join("");
  const c=$("projCtl");
  if(S.status!=="ready"){c.innerHTML="";return}
  let h="";
  if(S.projects.length){h+='<label class="sr" for="projSel">Project</label><select id="projSel">'+S.projects.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===S.pid?" selected":"")+">"+esc(x.name)+"</option>").join("")+"</select>";
    if(p)h+='<button class="btn" id="btnProjEdit" type="button">Project details</button>'}
  if(S.canWrite)h+='<button class="btn" type="button" data-act="importProjects">Import from planner</button><button class="btn primary" id="btnProjNew" type="button">+ New project</button>';
  c.innerHTML=h;
}
function renderSummary(){
  const el=$("summary");
  if(!project()||!S.items.length){el.hidden=true;return}
  el.hidden=false;const x=summary();const p=project();
  const contract=p&&dn(p.targetFinish);
  const slip=(x.fin!=null&&x.bfin!=null)?x.fin-x.bfin:0;
  const k=(cls,key,v,d)=>'<div class="kpi '+cls+'"><div class="k">'+key+'</div><div class="v mono">'+v+'</div><div class="d">'+d+"</div></div>";
  let h="";
  h+=k(slip>0?"bad":"good","Projected finish",fmt(x.fin),slip>0?"<span class='bad-t'>"+plural(slip,"day")+" behind</span> baseline "+fmt(x.bfin):slip<0?plural(-slip,"day")+" ahead of baseline":"On baseline ("+fmt(x.bfin)+")");
  if(contract!=null)h+=k(x.fin>contract?"bad":"","Contract finish",fmt(contract),x.fin>contract?"<span class='bad-t'>Projected "+plural(x.fin-contract,"day")+" over</span>":plural(contract-(x.fin??contract),"day")+" of float");
  h+=k("","Complete",x.pct+"%","Weighted by duration");
  h+=k(x.late?"bad":"","Late items",x.late,plural(x.slipped,"item")+" slipped from baseline");
  h+=k(x.unexp?"warn":"","Delays logged",plural(x.ddays,"day"),x.unexp?"<span style='color:var(--warn);font-weight:600'>"+plural(x.unexp,"item")+" with unexplained slip</span>":plural(x.dcount,"entry").replace("entrys","entries"));
  h+=k("","Subs on site this week",x.onsiteSubs,plural(x.onsite,"crew-day")+" committed");
  const dls=S.entries.filter(e=>e.kind==="deadline");
  if(dls.length){const bad=dls.filter(e=>["missed","overdue"].includes(entryState(e)));const next=dls.filter(e=>entryState(e)==="ok").sort((p,q)=>dn(p.date)-dn(q.date))[0];
    h+=k(bad.length?"bad":"","Deadlines",bad.length?bad.length+" at risk":(next?fmt(dn(next.date)):"All met"),bad.length?esc(bad.map(e=>e.title).slice(0,2).join(", "))+(bad.length>2?"…":""):next?"Next: "+esc(next.title):plural(dls.length,"deadline"))}
  el.innerHTML=h;
}
function renderTabs(){
  const t=$("tabs");
  if(!project()){t.innerHTML="";return}
  const unexp=S.items.filter(i=>info(i).unexplained>0).length;
  const unm=budgetLines().filter(l=>l.match==="none").length;
  const tabs=[["gantt","Schedule"],["calendar","Calendar"],["list","Task list"],["delays","Delay log"],["ahead","Look-ahead"],["billing","Billing forecast"],["history","History"]];
  t.innerHTML=tabs.map(([k,l])=>'<button class="tab" role="tab" type="button" data-view="'+k+'" aria-selected="'+(S.view===k)+'">'+l+(k==="delays"&&unexp?'<span class="count" title="Items with slip not explained by a logged delay">'+unexp+"</span>":"")+(k==="billing"&&unm?'<span class="count" style="background:var(--warn-soft);color:var(--warn)" title="Budget lines not matched to the schedule">'+unm+"</span>":"")+"</button>").join("");
}
function renderToolbar(){
  const t=$("toolbar");
  if(!project()){t.innerHTML="";return}
  let h="";
  if(S.canWrite){
    if(S.view==="delays")h+='<button class="btn primary" type="button" data-act="logdelay">+ Log a delay</button>';
    else if(S.view==="billing"){h+='<button class="btn primary" type="button" data-act="budgetUpload">'+(budgetLines().length?"Replace budget":"Upload budget")+"</button>";
      if(budgetLines().length)h+='<button class="btn" type="button" data-act="costUpload" title="QuickBooks Expenses by Vendor, a transaction detail report, or any file with Date and Amount columns">Upload actual costs</button><button class="btn" type="button" data-act="rematch" title="Re-match every line you haven’t set by hand">Re-run auto-match</button><button class="btn danger" type="button" data-act="delBudget">Remove budget</button>'}
    else if(S.view==="history"){}
    else if(S.view==="calendar")h+='<button class="btn primary" type="button" data-act="new" data-kind="task">+ Task</button><button class="btn" type="button" data-act="newEntry" data-kind="deadline">+ Deadline</button><button class="btn" type="button" data-act="newEntry" data-kind="note">+ Note</button>';
    else h+='<button class="btn primary" type="button" data-act="new" data-kind="phase">+ Phase</button><button class="btn" type="button" data-act="new" data-kind="task">+ Task</button><button class="btn" type="button" data-act="new" data-kind="milestone">+ Milestone / delivery</button>'+(S.view==="gantt"?'<button class="btn" type="button" data-act="newEntry" data-kind="deadline">+ Deadline</button><button class="btn" type="button" data-act="newEntry" data-kind="note">+ Note</button>':"");
    if(S.view==="gantt"||S.view==="list")h+='<button class="btn" type="button" data-act="progress" title="Move unfinished work that should already have happened to the status date">Update progress</button><button class="btn" type="button" data-act="mspImport" title="Microsoft Project XML, or an Excel/CSV export">Import from Project</button>';
  }
  h+='<span class="spacer"></span>';
  if(S.view==="gantt"||S.view==="list")h+='<label class="chk" title="Tasks with no float: any slip moves the finish date"><input type="checkbox" id="showCrit"'+(S.showCrit?" checked":"")+"> Critical path</label>";
  if(S.view==="calendar"){const mk=S.calMonth||monthKey(TODAY);
    h+='<label class="chk"><input type="checkbox" id="calPhases"'+(S.calPhases?" checked":"")+"> Show phases</label>";
    h+='<div class="seg" role="group" aria-label="Month"><button type="button" data-calnav="-1" aria-label="Previous month">‹</button><button type="button" data-calnav="0" aria-pressed="'+(mk===monthKey(TODAY))+'">Today</button><button type="button" data-calnav="1" aria-label="Next month">›</button></div>'}
  if(S.view==="gantt"||S.view==="list"){
    h+='<label class="sr" for="q">Search</label><input type="text" id="q" placeholder="Search task, sub, trade…" value="'+esc(S.q)+'">';
    h+='<label class="chk"><input type="checkbox" id="onlyIssues"'+(S.onlyIssues?" checked":"")+'> Slipped or late only</label>';
  }
  if(S.view==="gantt")h+='<div class="seg" role="group" aria-label="Zoom">'+[["day","Days"],["week","Weeks"],["month","Months"]].map(([k,l])=>'<button type="button" data-zoom="'+k+'" aria-pressed="'+(S.zoom===k)+'">'+l+"</button>").join("")+"</div>";
  if(S.view==="billing"){const p=project();const dis=S.canWrite?"":" disabled";
    if(budgetLines().length)h+='<label class="chk"><input type="checkbox" id="billReview"'+(S.billReview?" checked":"")+"> Needs review only</label>";
      h+='<label class="chk" for="bill_ret">Retainage <input type="number" id="bill_ret" min="0" max="25" step="0.5" value="'+(Number(p.retainagePct)||0)+'"'+dis+"> %</label>"}
  if(S.view==="ahead")h+='<div class="seg" role="group" aria-label="Weeks shown">'+[2,3,4,6].map(n=>'<button type="button" data-ahead="'+n+'" aria-pressed="'+(S.ahead===n)+'">'+n+" wk</button>").join("")+"</div>";
  h+='<div class="seg" role="group" aria-label="Export this tab"><button type="button" data-export="pdf" title="Save this tab as a PDF">PDF</button><button type="button" data-export="xlsx" title="Save this tab as an Excel workbook">Excel</button></div>';
  // keep focus in search box across re-render
  const hadFocus=document.activeElement&&document.activeElement.id==="q";const pos=hadFocus?document.activeElement.selectionStart:0;
  t.innerHTML=h;
  if(hadFocus){const q=$("q");if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}
}
function renderMain(){
  const m=$("main");
  if(S.status==="nodb"){m.innerHTML='<div class="panel empty"><h2>Schedule storage isn’t available here</h2><p>Open this page on claude.ai while signed in to view and edit the shared job schedules.</p></div>';return}
  if(S.status==="loading"){m.innerHTML='<div class="panel empty"><p>Loading schedules…</p></div>';return}
  if(!project()){
    m.innerHTML='<div class="panel empty"><h2>No projects yet</h2><p>Create a project, then add phases (for example “Rough carpentry, Mar 2 for 4 weeks”), tasks under each phase with the subcontractor and their committed on-site dates, and milestones like tile delivery or inspections.</p>'+
      (S.canWrite?'<div class="row"><button class="btn primary" type="button" data-act="newproj">+ New project</button><button class="btn" type="button" data-act="importProjects">Import from planner</button><button class="btn" type="button" data-act="sample">Load a sample project</button></div><p class="hint">The sample is a made-up kitchen and bath remodel you can explore and delete.</p>':"<p>You have view-only access. Ask the owner to add a project.</p>")+"</div>";
    return;
  }
  if(!S.itemsReady){m.innerHTML='<div class="panel empty"><p>Loading schedule…</p></div>';return}
  if(!S.items.length&&!["delays","billing","calendar","history"].includes(S.view)){
    m.innerHTML='<div class="panel empty"><h2>Build the schedule</h2><p>Start with phases for the big blocks of work, set a start date and a duration in weeks, then add tasks and deliveries inside each phase.</p>'+(S.canWrite?'<div class="row"><button class="btn primary" type="button" data-act="new" data-kind="phase">+ Add first phase</button></div>':"")+"</div>";return;
  }
  if(S.view==="gantt")m.innerHTML=ganttHTML();
  else if(S.view==="list")m.innerHTML=listHTML();
  else if(S.view==="delays")m.innerHTML=delaysHTML();
  else if(S.view==="billing")m.innerHTML=billingHTML();

  else if(S.view==="history")m.innerHTML=historyHTML();

}

/* ---------- Gantt ---------- */
let lastGanttKey="";
function ganttRange(){
  const ns=[TODAY];
  S.items.forEach(i=>{const x=info(i);[x.s,x.e,x.bs,x.be].forEach(v=>{if(v!=null)ns.push(v)});(i.onsite||[]).forEach(d=>{const v=dn(d);if(v!=null)ns.push(v)})});
  S.entries.forEach(e=>{const v=dn(e.date);if(v!=null)ns.push(v)});
  let a=Math.min(...ns)-7,b=Math.max(...ns)+21;a=monday(a);
  return {a,b};
}
function ganttHTML(){
  const dw={day:30,week:12,month:4}[S.zoom]||12;
  const {a,b}=ganttRange();const days=b-a+1;const W=days*dw;
  // header
  let hd="";
  for(let n=a;n<=b;n++){
    const d=new Date(n*DAY);
    if(d.getUTCDate()===1||n===a){const lab=d.toLocaleDateString(undefined,{month:S.zoom==="month"?"short":"long",year:(d.getUTCMonth()===0||n===a)?"numeric":undefined,timeZone:"UTC"});hd+='<div class="mlab" style="left:'+(n-a)*dw+'px">'+esc(lab)+"</div>"}
    if(S.zoom==="day")hd+='<div class="tlab" style="left:'+(n-a)*dw+'px;width:'+dw+'px">'+d.getUTCDate()+"</div>";
    else if(S.zoom==="week"&&dow(n)===1)hd+='<div class="tlab" style="left:'+(n-a)*dw+'px;width:'+(7*dw)+'px;text-align:left;padding-left:3px">'+d.getUTCDate()+"</div>";
  }
  const tx=(TODAY-a)*dw+dw/2;
  hd+='<div class="today-lab" style="left:'+tx+'px">Today</div>';
  // track background: weekend shading (day/week zoom) + weekly grid line
  const bg=S.zoom==="month"
    ? "background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:"+(7*dw)+"px 100%"
    : "background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px,transparent "+(5*dw)+"px,var(--wknd) "+(5*dw)+"px,var(--wknd) "+(7*dw)+"px);background-size:"+(7*dw)+"px 100%";
  let rows="",yTop=0;const pos=new Map();
  const rs=orderedRows(true);const byIdAll=new Map(S.items.map(i=>[i.id,i]));
  // deadline flags and note markers
  const mark=e=>{const n=dn(e.date);if(n==null||n<a||n>b)return "";const x=(n-a)*dw+dw/2;const st=entryState(e);
    const tip=esc((e.kind==="deadline"?"Deadline ":"Note ")+fmt(n)+": "+e.title+(e.kind==="deadline"?" · "+ENTRY_TXT[st]:""));
    return e.kind==="deadline"?'<div class="dlm '+st+'" style="left:'+(x-1)+'px" data-entry="'+esc(e.id)+'" title="'+tip+'"></div>':'<div class="ntm" style="left:'+x+'px" data-entry="'+esc(e.id)+'" title="'+tip+'"></div>'};
  const loose=S.entries.filter(e=>!e.itemId||!S.items.some(i=>i.id===e.itemId));
  if(loose.length){rows+='<div class="grow task" style="cursor:default"><div class="glabel"><span class="nm">Deadlines &amp; notes</span></div><div class="gtrack" style="width:'+W+"px;"+bg+'">'+loose.map(mark).join("")+"</div></div>";yTop+=36}
  for(const r of rs){
    const rh=r.group||(r.it&&r.it.kind==="phase")?38:36;
    if(r.it){const x0=info(r.it);if(x0.s!=null)pos.set(r.it.id,{y:yTop+rh/2,xs:r.it.kind==="milestone"?(x0.s-a)*dw+dw/2-8:(x0.s-a)*dw,xe:r.it.kind==="milestone"?(x0.s-a)*dw+dw/2+8:(x0.e-a+1)*dw})}
    yTop+=rh;
    if(r.group){rows+='<div class="grow phase" style="cursor:default"><div class="glabel"><span class="nm dim">'+esc(r.group)+'</span></div><div class="gtrack" style="width:'+W+'px;'+bg+'"></div></div>';continue}
    const it=r.it,x=info(it);

    }else{

      if(x.s!=null){
        const pct=it.status==="Complete"?100:Math.min(100,Math.max(0,Number(it.pct)||0));
        tr+='<div class="bar '+stClass(it)+(x.late?" late":"")+(crit?" crit":"")+'" style="left:'+(x.s-a)*dw+"px;width:"+Math.max(dw,(x.e-x.s+1)*dw)+'px" title="'+tip+'">'+(pct&&pct<100?'<div class="pf" style="width:'+pct+'%"></div>':"")+"</div>";
        if(x.slip>0)tr+='<div class="slipt" style="left:'+((x.e-a+1)*dw+4)+'px">+'+x.slip+"d</div>";
      }
    }
    const mine=S.entries.filter(e=>e.itemId===it.id);mine.forEach(e=>tr+=mark(e));
    if(mine.some(e=>entryState(e)==="missed"))lab+='<span class="flag bad" title="Scheduled to finish after a linked deadline">deadline</span>';
    const cf=conflictOf(it,byIdAll);if(cf)lab+='<span class="flag bad" title="Starts '+plural(cf.days,"working day")+' before its links allow (earliest '+esc(fmt(cf.earliest))+')'+(it.cons&&it.cons.type==="MSO"?". Its start date is pinned.":"")+'">link</span>';
    if(it.lockOnsite&&onsiteOutside(it).length)lab+='<span class="flag warn" title="Locked sub on-site dates fall outside this task’s dates">sub dates</span>';
    (it.onsite||[]).forEach(d=>{const n=dn(d);if(n==null)return;tr+='<div class="os" style="left:'+((n-a)*dw+1)+"px;width:"+Math.max(3,dw-2)+'px" title="'+esc((it.sub||it.name)+" on site "+fmtW(n)+" "+fmt(n))+'"></div>'});
    rows+='<div class="grow '+cls+'" data-open="'+esc(it.id)+'" tabindex="0"><div class="glabel">'+lab+'</div><div class="gtrack" style="width:'+W+"px;"+bg+";background-position:"+(((a-monday(a))%7)*dw)+'px 0">'+tr+"</div></div>";
  }
  if(!rs.length)rows='<div class="empty"><p>No items match the current filter.</p></div>';
  // link arrows between visible rows: FS end→start, SS start→start, FF end→end
  let links="";
  S.items.forEach(s=>linksOf(s).forEach(l=>{const P=pos.get(l.id),Q=pos.get(s.id);if(!P||!Q)return;
    const P0=byIdAll.get(l.id);const hot=S.showCrit&&P0&&isCritical(P0)&&isCritical(s);
    const col=hot?"var(--bad)":"var(--muted)",mk=hot?"url(#arrc)":"url(#arr)";let d;
    if(l.type==="SS"){const x1=P.xs,x2=Q.xs,xm=Math.min(x1,x2)-8;d="M"+x1+","+P.y+"H"+xm+"V"+Q.y+"H"+(x2-2)}

    else{const x1=P.xe,y1=P.y,x2=Q.xs,y2=Q.y;const tight=x2-x1<12,mid=y2+(y2>y1?-10:10);
      d=tight?"M"+x1+","+y1+"H"+(x1+6)+"V"+mid+"H"+(x2-8)+"V"+y2+"H"+(x2-2):"M"+x1+","+y1+"H"+(x1+6)+"V"+y2+"H"+(x2-2)}
    links+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="'+(hot?1.75:1.25)+'" marker-end="'+mk+'" opacity="'+(hot?1:.75)+'"/>'}));
  if(links)links='<svg class="glinks" width="'+W+'" height="'+yTop+'" style="left:var(--lw)" aria-hidden="true"><defs><marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--muted)"/></marker><marker id="arrc" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L6,3L0,6Z" fill="var(--bad)"/></marker></defs>'+links+"</svg>";
  // holidays on the work calendar
  let hols="";CAL.hol.forEach((name,n)=>{if(n>=a&&n<=b)hols+='<div class="hol" style="left:calc(var(--lw) + '+((n-a)*dw)+'px);width:'+Math.max(2,dw)+'px" title="'+esc(name+" · "+fmt(n))+'"></div>'});
  links+=hols;
  const key=S.pid+S.zoom;
  return '<div class="panel"><div class="gwrap" id="gwrap" data-key="'+esc(key)+'" data-tx="'+tx+'"><div class="ghead"><div class="glabel">Phase / task</div><div class="gtrack" style="width:'+W+'px">'+hd+'</div></div><div style="position:relative">'+rows+links+'<div class="today" style="left:calc(var(--lw) + '+(tx-1)+'px)"></div></div></div>'+

function scrollGanttToToday(){

/* ---------- delays ---------- */
function delaysHTML(){
  const ds_=S.delays.slice().sort((p,q)=>(dn(q.date)??0)-(dn(p.date)??0)||(q.createdAt||0)-(p.createdAt||0));
  const by={};ds_.forEach(d=>{const c=d.cause||"Other";by[c]=(by[c]||0)+(Number(d.days)||0)});
  const causes=Object.entries(by).sort((p,q)=>q[1]-p[1]);const max=Math.max(1,...causes.map(c=>c[1]));
  const total=ds_.reduce((a,d)=>a+(Number(d.days)||0),0);
  const unexp=S.items.map(i=>[i,info(i)]).filter(([i,x])=>x.unexplained>0);
  let left='<div class="panel"><h2 class="ph-h">Days by cause <span class="mono dim" style="font-size:15px">'+plural(total,"day")+"</span></h2>";
  left+=causes.length?causes.map(([c,v])=>'<div class="cause"><span>'+esc(c)+'</span><span class="mono">'+v+'d</span><div class="track"><div class="fill" style="width:'+Math.max(2,v/max*100)+'%"></div></div></div>').join("")+'<div style="height:8px"></div>':'<p class="hint" style="padding:0 14px">No delays logged yet.</p>';
  if(unexp.length){left+='<div class="callout"><strong>Slip without an explanation</strong><div class="hint" style="color:inherit">These items moved past their baseline by more days than have been logged. Open one and log what caused it.</div><div class="dlog" style="margin-top:8px">'+unexp.map(([i,x])=>'<button type="button" class="chip se" data-open="'+esc(i.id)+'">'+esc(i.name)+" · "+x.unexplained+"d unexplained</button>").join("")+"</div></div>"}
  left+="</div>";
  let right='<div class="panel tblwrap"><h2 class="ph-h">Delay log</h2><table><thead><tr><th>Date</th><th>Item</th><th>Cause</th><th class="num">Days</th><th>What happened</th><th>Logged by</th></tr></thead><tbody>';
  right+=ds_.length?ds_.map(d=>{const it=S.items.find(i=>i.id===d.itemId);return '<tr class="click" data-open-delay="'+esc(d.id)+'"><td class="mono">'+fmt(dn(d.date))+"</td><td>"+esc(it?it.name:(d.itemName||"(deleted item)"))+(it&&it.sub?'<div class="hint">'+esc(it.sub)+"</div>":"")+"</td><td>"+esc(d.cause||"")+'</td><td class="num mono">'+(Number(d.days)||0)+'</td><td class="expl">'+esc(d.explanation||"")+'</td><td class="dim" data-uid="'+esc(d.loggedBy||"")+'">'+esc(nameOf(d.loggedBy))+"</td></tr>"}).join(""):'<tr><td colspan="6" class="dim" style="text-align:center;padding:30px">No delays logged. Use “Log a delay” when something pushes the schedule, and say what caused it.</td></tr>';
  right+="</tbody></table></div>";
  return '<div class="dgrid">'+left+right+"</div>";
}
function nameOf(uid){if(!uid)return "—";if(uid===S.uid)return "You";return S.names[uid]||"Team member"}
async function resolveNames(){
  if(!S.user)return;const ids=[...new Set(S.delays.map(d=>d.loggedBy).concat(S.items.map(i=>i.updatedBy)).filter(Boolean))].filter(id=>!(id in S.names));

/* ---------- look-ahead ---------- */
function aheadHTML(){
  const a=monday(TODAY);const nW=S.ahead;
  const byDay={};const add=(n,html)=>{(byDay[n]=byDay[n]||[]).push(html)};
  for(const it of S.items){
    const x=info(it);
    (it.onsite||[]).forEach(d=>{const n=dn(d);if(n!=null)add(n,{o:0,h:'<button type="button" class="chip on" data-open="'+esc(it.id)+'"><strong>'+esc(it.sub||"Crew")+"</strong><br>"+esc(it.name)+"</button>"})});
    if(it.kind==="milestone"&&x.s!=null)add(x.s,{o:1,h:'<button type="button" class="chip ms" data-open="'+esc(it.id)+'">◆ '+esc(it.name)+(x.slip>0?' <span class="bad-t">+'+x.slip+"d</span>":"")+"</button>"});
    if(it.kind==="task"){
      if(x.s!=null)add(x.s,{o:2,h:'<button type="button" class="chip se" data-open="'+esc(it.id)+'">Starts: '+esc(it.name)+"</button>"});
      if(x.e!=null&&x.e!==x.s)add(x.e,{o:3,h:'<button type="button" class="chip se" data-open="'+esc(it.id)+'">Due: '+esc(it.name)+"</button>"});
    }
  }
  S.entries.forEach(e=>{const n=dn(e.date);if(n!=null)add(n,{o:e.kind==="deadline"?-1:4,h:entryChip(e)})});
  let h='<div class="panel"><div class="weeks">';
  for(let w=0;w<nW;w++){
    const w0=a+w*7;
    h+='<div class="wk"><h3>Week of '+fmt(w0)+(w===0?' <span class="dim" style="font-weight:500;font-size:15px">· this week</span>':"")+'</h3><div class="days">';
    for(let d=0;d<7;d++){
      const n=w0+d;const items=(byDay[n]||[]).sort((p,q)=>p.o-q.o);
      h+='<div class="day'+(d>=5?" we":"")+(n===TODAY?" td":"")+(items.length?"":" emptyday")+'"><div class="dn">'+fmtW(n)+" "+fmt(n)+"</div>"+items.map(i=>i.h).join("")+"</div>";
    }
    h+="</div></div>";
  }
  h+='</div><div class="legend"><span><i class="sw" style="background:var(--accent)"></i>Subcontractor committed on site</span><span><i class="sw" style="background:var(--steel)"></i>Milestone / delivery</span><span><i class="sw" style="background:var(--bar)"></i>Task starts or is due</span><span><i class="sw" style="background:var(--bad)"></i>Deadline</span><span><i class="sw" style="background:var(--warn)"></i>Note</span></div></div>';
  return h;
}

/* ---------- deadlines & notes ---------- */
// entries/{id}: {projectId, kind:"deadline"|"note", date, title, text, itemId, done}
function entryState(e){ // note | done | missed (linked item now finishes after it) | overdue | ok
  if(e.kind!=="deadline")return "note";if(e.done)return "done";
  const d=dn(e.date);const it=e.itemId&&S.items.find(i=>i.id===e.itemId);
  if(it){if(it.status==="Complete")return "done";const x=info(it);if(x.e!=null&&d!=null&&x.e>d)return "missed"}
  return d!=null&&d<TODAY?"overdue":"ok";
}
const ENTRY_TXT={missed:"Schedule misses this",overdue:"Past due",done:"Met",ok:"Upcoming"};
function entryChip(e){
  const st=entryState(e);const it=e.itemId&&S.items.find(i=>i.id===e.itemId);
  return '<button type="button" class="chip '+(e.kind==="deadline"?"dl "+st:"nt")+'" data-entry="'+esc(e.id)+'" title="'+esc((e.kind==="deadline"?"Deadline":"Note")+": "+e.title+(it?" · "+it.name:"")+(e.kind==="deadline"?" · "+ENTRY_TXT[st]:""))+'">'+(e.kind==="deadline"?"Due: ":"")+esc(e.title)+"</button>";
}

/* ---------- calendar (month) ---------- */
function calendarHTML(){
  const mk=S.calMonth||monthKey(TODAY);const [y,m]=mk.split("-").map(Number);
  const first=Math.round(Date.UTC(y,m-1,1)/DAY),last=Math.round(Date.UTC(y,m,0)/DAY);
  const g0=monday(first),g1=monday(last)+6;
  const bars=S.items.filter(i=>i.kind==="task"||(S.calPhases&&i.kind==="phase"));
  let h='<div class="panel"><h2 class="ph-h">'+esc(keyLabel(mk,true))+'<span class="hint" style="font-family:var(--f-body);font-weight:500">Click a day to see everything on it or add a task, deadline or note</span></h2><div class="calwrap"><div class="cal"><div class="cal-head">'+["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>"<div>"+d+"</div>").join("")+"</div>";
  for(let w=g0;w<=g1;w+=7){
    // lay task bars into lanes for this week
    const segs=[];
    bars.forEach(it=>{const {s,e}=spanOf(it);if(s==null||e<w||s>w+6)return;segs.push({it,a:Math.max(s,w)-w,b:Math.min(e,w+6)-w,cl:s<w,cr:e>w+6})});
    segs.sort((p,q)=>p.a-q.a||(q.b-q.a)-(p.b-p.a)||(p.it.kind==="phase"?-1:1));
    const lanes=[];segs.forEach(sg=>{let l=0;while(lanes[l]!=null&&lanes[l]>=sg.a)l++;lanes[l]=sg.b;sg.l=l});
    h+='<div class="cal-week">';
    for(let d=0;d<7;d++){
      const n=w+d,date=new Date(n*DAY);let chips="";
      if(CAL.hol.has(n))chips+='<span class="chip hol">'+esc(CAL.hol.get(n))+"</span>";
      entriesOn(n).forEach(e=>chips+=entryChip(e));
      S.items.forEach(it=>{
        if(it.kind==="milestone"&&dn(it.start)===n)chips+='<button type="button" class="chip ms" data-open="'+esc(it.id)+'">◆ '+esc(it.name)+"</button>";
        if((it.onsite||[]).includes(ds(n)))chips+='<button type="button" class="chip on" data-open="'+esc(it.id)+'" title="'+esc(it.name)+'">On site: '+esc(it.sub||it.name)+"</button>";
      });
      h+='<div class="cal-day'+(n<first||n>last?" out":"")+(d>=5?" we":"")+(CAL.hol.has(n)?" holday":"")+(n===TODAY?" td":"")+'" data-calday="'+ds(n)+'"><span class="cal-dn">'+(date.getUTCDate()===1?fmt(n):date.getUTCDate())+'</span><div class="cal-lanes" style="height:'+(lanes.length*22)+'px"></div>'+chips+"</div>";
    }
    segs.forEach(sg=>{const it=sg.it,x=info(it);
      h+='<button type="button" class="cal-bar '+stClass(it)+(x.late?" late":"")+(it.kind==="phase"?" ph":"")+'" data-open="'+esc(it.id)+'" style="top:'+(28+sg.l*22)+"px;left:calc("+(sg.a/7*100).toFixed(4)+"% + 3px);width:calc("+((sg.b-sg.a+1)/7*100).toFixed(4)+'% - 6px)" title="'+esc(it.name+(it.sub?" · "+it.sub:"")+" — "+fmt(x.s)+" to "+fmt(x.e))+'">'+(sg.cl?"‹ ":"")+esc(it.name)+(it.sub?' <span class="dim">· '+esc(it.sub)+"</span>":"")+(sg.cr?" ›":"")+"</button>"});
    h+="</div>";
  }
  h+='</div></div><div class="legend"><span><i class="sw" style="background:color-mix(in srgb,var(--steel) 30%,var(--panel));border-left:3px solid var(--steel)"></i>Task (color = status)</span><span><i class="sw" style="background:var(--bad-soft);border-left:3px solid var(--bad)"></i>Deadline the schedule misses or is past due</span><span><i class="sw" style="background:var(--panel-2);border-left:3px solid var(--ink)"></i>Upcoming deadline</span><span><i class="sw" style="background:var(--warn-soft);border-left:3px solid var(--warn)"></i>Note</span><span><i class="sw" style="background:var(--accent)"></i>Sub on site</span><span><i class="sw" style="background:var(--steel)"></i>◆ Milestone</span></div></div>';
  return h;
}

async function saveEntry(){
  const d=S.drawer;const e=d.id?S.entries.find(x=>x.id===d.id):null;
  const title=val("en_title"),date=val("en_date");
  if(!title){toast("Give it a title.");$("en_title").focus();return}
  if(!date){toast("Pick a date.");$("en_date").focus();return}
  const kind=val("en_kind")||"note";
  const body={kind,title,date,itemId:val("en_item")||"",text:val("en_text")||"",done:kind==="deadline"&&!!($("en_done")&&$("en_done").checked),...stamp()};
  try{
    if(e){await S.db.doc("entries/"+e.id).update(body);const b0={},a0={};["kind","title","date","itemId","text","done"].forEach(k=>{if(!same(e[k],body[k])){b0[k]=e[k]??null;a0[k]=body[k]}});if(Object.keys(a0).length)await logHistory("entry","Edited "+(kind==="deadline"?"deadline":"note")+" "+title,[{coll:"entries",id:e.id,name:title,before:b0,after:a0}])}
    else{const full=Object.assign(body,{projectId:S.pid,createdAt:Date.now(),createdBy:S.uid||null});const ref=await S.db.collection("entries").add(full);await logHistory("entry","Added "+(kind==="deadline"?"deadline":"note")+" "+title,[{coll:"entries",id:ref.id,name:title,before:null,after:full}])}
    closeDrawer();toast((kind==="deadline"?"Deadline":"Note")+(e?" saved":" added"));
  }catch(err){dbErr(err)}
}

function openDrawer(d){S.drawer=d;renderDrawer();$("drawer").hidden=false;$("drawerBack").hidden=false;setTimeout(()=>{const f=$("drawer").querySelector("input,select,textarea,button");if(f)f.focus()},30)}
function closeDrawer(){S.drawer=null;$("drawer").hidden=true;$("drawerBack").hidden=true;$("drawer").innerHTML=""}
function phaseOptions(sel){return '<option value="">(No phase)</option>'+phases().map(p=>'<option value="'+esc(p.id)+'"'+(p.id===sel?" selected":"")+">"+esc(p.name)+"</option>").join("")}
const dl=(id,arr)=>'<datalist id="'+id+'">'+arr.map(v=>'<option value="'+esc(v)+'">').join("")+"</datalist>";
function knownSubs(){return [...new Set(S.items.map(i=>i.sub).filter(Boolean))].sort()}

function renderDrawer(){
  const d=S.drawer;const el=$("drawer");if(!d)return;
  // keep in-progress form values when re-rendering due to live updates: only rebuild when the target changes
  const sig=d.type+":"+(d.id||"new")+":"+(d.kind||"");
  if(el.dataset.sig===sig&&el.innerHTML)return refreshDrawerLive();
  el.dataset.sig=sig;
  if(d.type==="item")el.innerHTML=itemForm(d);
  else if(d.type==="project")el.innerHTML=projectForm(d);
  else if(d.type==="delay")el.innerHTML=delayEditForm(d);
  else if(d.type==="logdelay")el.innerHTML=logDelayStandalone();
  else if(d.type==="budgetImport")el.innerHTML=budgetImportForm(d);
  else if(d.type==="projImport")el.innerHTML=projImportForm(d);
  else if(d.type==="day")el.innerHTML=dayForm(d);
  else if(d.type==="progress")el.innerHTML=progressForm(d);
  else if(d.type==="msp")el.innerHTML=mspImportForm(d);
  else if(d.type==="entry")el.innerHTML=entryForm(d);
  wireDrawer();
}

  const d=S.drawer;if(d.type!=="item"||!d.id)return;const it=S.items.find(i=>i.id===d.id);if(!it)return;

/* ---------- scheduling engine: work calendar, links, constraints, float ---------- */
// Work calendar lives on the project: calendar = {days:[1..6 = Mon..Sat, 0 = Sun], holidays:[{date,name}]}.
// Items with calDays:true (cure, dry time) count every calendar day.
let CAL={days:new Set([1,2,3,4,5]),hol:new Map()};
function loadCalendar(){const c=(project()||{}).calendar||{};CAL={days:new Set(Array.isArray(c.days)&&c.days.length?c.days:[1,2,3,4,5]),hol:new Map((c.holidays||[]).filter(h=>dn(h.date)!=null).map(h=>[dn(h.date),h.name||"Holiday"]))}}
const isWork=n=>CAL.days.has(dow(n))&&!CAL.hol.has(n);
const nextWorkday=n=>{let g=0;while(!isWork(n)&&g++<400)n++;return n};
const prevWorkday=n=>{let g=0;while(!isWork(n)&&g++<400)n--;return n};
function addWorkdays(n,k,cd){if(cd)return n+k;let x=n;const step=k<0?-1:1;let left=Math.abs(k),g=0;while(left>0&&g++<20000){x+=step;if(isWork(x))left--}return x}
function workdaysBetween(a,b,cd){if(cd)return b-a;let c=0;const s=a<b?1:-1;for(let x=a;x!==b;x+=s)if(isWork(x+s))c+=s;return c} // signed
const endOf=i=>i.kind==="milestone"?dn(i.start):(dn(i.end)!=null?dn(i.end):dn(i.start));
const startOf=i=>dn(i.start);
function durOf(i){ // length after the first day, in the item's own units (working days, or calendar days when calDays)
  const s=dn(i.start),e=endOf(i);if(s==null||e==null)return 0;
  return Math.max(0,i.calDays?e-s:workdaysBetween(isWork(s)?s:nextWorkday(s),e));
}
// Links: item.preds holds ids (finish-to-start) or {id, type:"FS"|"SS"|"FF", lag} with lag in working days (negative = lead).
const LINK_TXT={FS:"Finish-to-start",SS:"Start-to-start",FF:"Finish-to-finish"};
const LINK_SHORT={FS:"after it finishes",SS:"after it starts",FF:"finishes after it"};
const linksOf=i=>(i.preds||[]).map(p=>typeof p==="string"?{id:p,type:"FS",lag:0}:{id:p&&p.id,type:(p&&p.type)||"FS",lag:Number(p&&p.lag)||0}).filter(l=>l.id);
const predIds=i=>linksOf(i).map(l=>l.id);
const linkLabel=(l,p)=>(p?p.name:"(deleted)")+" · "+({FS:"FS",SS:"SS",FF:"FF"}[l.type])+(l.lag?(l.lag>0?" +":" ")+l.lag+"d":"");
function earliestStart(it,byId){ // earliest start allowed by its links and a start-no-earlier-than constraint
  let m=null;const up=v=>{if(v!=null&&(m==null||v>m))m=v};
  linksOf(it).forEach(l=>{const p=byId.get(l.id);if(!p)return;const ps=startOf(p),pe=endOf(p);if(ps==null)return;
    if(l.type==="SS")up(nextWorkday(addWorkdays(ps,l.lag)));
    else if(l.type==="FF"){const fin=nextWorkday(addWorkdays(pe,l.lag));const len=durOf(it);up(it.calDays?fin-len:nextWorkday(addWorkdays(fin,-len)))}
    else up(nextWorkday(addWorkdays(pe,1+l.lag)))});
  if(it.cons&&it.cons.type==="SNET"&&dn(it.cons.date)!=null)up(nextWorkday(dn(it.cons.date)));
  return m;
}
const successorsOf=id=>S.items.filter(i=>predIds(i).includes(id));
function downstream(id){ // every item that waits on id, directly or through others
  const seen=new Set(),q=[id];while(q.length){const c=q.shift();successorsOf(c).forEach(s=>{if(!seen.has(s.id)){seen.add(s.id);q.push(s.id)}})}return seen;
}
// Move an item so it starts on newStart, keeping its length. On-site dates follow unless the sub's dates are locked.
function moveTo(i,newStart){
  const s=dn(i.start);const o={start:ds(newStart)};const cd=!!i.calDays;
  if(i.end){const len=durOf(i);o.end=ds(len?addWorkdays(newStart,len,cd):newStart)}
  if(i.onsite&&i.onsite.length&&!i.lockOnsite){const k=workdaysBetween(isWork(s)?s:nextWorkday(s),newStart,cd);o.onsite=i.onsite.map(x=>ds(addWorkdays(dn(x),k,cd))).sort()}
  return o;
}
const shiftDates=(i,delta)=>moveTo(i,dn(i.start)+delta);
// Problems the engine can see on an item
function conflictOf(it,byId){
  if(it.status==="Complete"||startOf(it)==null)return null;
  const e=earliestStart(it,byId||new Map(S.items.map(i=>[i.id,i])));
  if(e!=null&&startOf(it)<e)return {kind:"link",days:workdaysBetween(startOf(it),e),earliest:e};
  return null;
}
const onsiteOutside=it=>{const s=startOf(it),e=endOf(it);return (it.onsite||[]).filter(d=>{const n=dn(d);return n!=null&&s!=null&&(n<s||n>e)})};
// Total float (working days an item can slip before the job's finish moves), by a backward pass over the links.
function scheduleFloat(){
  const items=S.items.filter(i=>startOf(i)!=null&&!(i.kind==="phase"&&!i.start));
  const out=new Map();if(!items.length)return out;
  const byId=new Map(items.map(i=>[i.id,i]));
  const finish=Math.max(...items.map(endOf));
  const succ=new Map(items.map(i=>[i.id,[]]));
  items.forEach(i=>linksOf(i).forEach(l=>{if(succ.has(l.id))succ.get(l.id).push({s:i,l})}));
  const LF=new Map(),busy=new Set();
  const lateFinish=id=>{
    if(LF.has(id))return LF.get(id);if(busy.has(id))return finish;busy.add(id);
    const it=byId.get(id);let lf=finish;
    for(const {s,l} of succ.get(id)){
      const sLF=lateFinish(s.id),sLen=durOf(s);const sLS=s.calDays?sLF-sLen:addWorkdays(prevWorkday(sLF),-sLen);
      let lim;
      if(l.type==="SS"){const pLS=addWorkdays(sLS,-l.lag);lim=it.calDays?pLS+durOf(it):addWorkdays(pLS,durOf(it))}
      else if(l.type==="FF")lim=addWorkdays(sLF,-l.lag);
      else lim=addWorkdays(sLS,-(1+l.lag));
      if(lim<lf)lf=lim;
    }
    if(it.cons&&it.cons.type==="MSO")lf=Math.min(lf,endOf(it));
    busy.delete(id);LF.set(id,lf);return lf;
  };
  items.forEach(i=>{if(i.status==="Complete"){out.set(i.id,null);return}const lf=lateFinish(i.id),ef=endOf(i);out.set(i.id,i.calDays?lf-ef:workdaysBetween(ef,lf))});
  return out;
}
const floatOf=it=>S.float&&S.float.has(it.id)?S.float.get(it.id):null;
const isCritical=it=>{const f=floatOf(it);return f!=null&&f<=0};
// Given new dates for some items, work out how every linked item downstream must move.
// A successor that started right after its predecessor stays tight to it (moves earlier or later with it);
// one with slack only moves when the predecessor now runs into it. Complete items never move.
function planCascade(changes,before){
  // `before` is the schedule as it stood before these changes (our own writes echo back into S.items immediately)
  const baseItems=before||S.items;
  const orig=new Map(baseItems.map(i=>[i.id,i]));
  const cur=new Map(baseItems.map(i=>[i.id,Object.assign({},i)]));
  changes.forEach((v,id)=>cur.set(id,Object.assign({},cur.get(id)||{},v)));
  const out=new Map(),q=[...changes.keys()];let guard=0;
  while(q.length&&guard++<5000){
    const id=q.shift();
    for(const s0 of baseItems.filter(i=>predIds(i).includes(id))){
      const s=cur.get(s0.id);if(s.status==="Complete"||dn(s.start)==null)continue;
      if(s.cons&&s.cons.type==="MSO")continue; // pinned dates never move; a conflict gets flagged instead
      const st=dn(s.start),oldE=earliestStart(s0,orig),newE=earliestStart(s,cur);if(newE==null)continue;
      const target=(oldE!=null&&dn(s0.start)===oldE)?newE:Math.max(st,newE);
      if(target===st)continue;
      const up=moveTo(s,target);Object.assign(s,up);
      out.set(s.id,Object.assign(out.get(s.id)||{},up));q.push(s.id);
    }
  }
  return out;
}
async function applyCascade(changes,before){
  const plan=planCascade(changes,before);
  for(const [id,up] of plan)await S.db.doc("items/"+id).update(Object.assign({},up,stamp()));
  return plan.size;
}

function shiftTargets(it,mode){
  if(mode==="none")return [];
  const x=info(it);const set=new Map();const addIt=i=>{if(i.status!=="Complete")set.set(i.id,i)};
  addIt(it);
  if(it.kind==="phase")childrenOf(it.id).forEach(addIt);
  if(mode==="phase"&&it.kind!=="phase"&&it.phaseId)childrenOf(it.phaseId).forEach(k=>{const kx=info(k);if(k.id!==it.id&&kx.s!=null&&x.s!=null&&kx.s>=x.s)addIt(k)});
  if(mode==="after")S.items.forEach(k=>{if(k.id===it.id)return;const kx=info(k);if(kx.s!=null&&x.s!=null&&kx.s>x.s)addIt(k)});
  return [...set.values()];
}
async function saveDelay(prefix){

  if(!it){toast("Pick the item that was delayed.");return}
  const days=Math.max(0,Math.round(Number(val(p+"d_days"))||0));
  const expl=val(p+"d_expl");
  if(!expl){toast("Explain what caused the delay.");$(p+"d_expl").focus();return}
  const r=document.querySelector('input[name="'+p+'d_shift"]:checked');const mode=r?r.value:"self";
  const entry={projectId:S.pid,itemId:it.id,itemName:it.name,date:val(p+"d_date")||ds(TODAY),days,cause:val(p+"d_cause")||"Other",explanation:expl,shift:days?mode:"none",loggedBy:S.uid||null,createdAt:Date.now()};
  const before=S.items.map(i=>Object.assign({},i));
  try{
    await S.db.collection("delays").add(entry);
    let moved=0,mine=null;const changes=new Map();
    if(days&&mode!=="none"){
      for(const t of shiftTargets(it,mode)){
        if(!t.start)continue; // phases sized by their tasks move with them
        if(t.cons&&t.cons.type==="MSO")continue; // pinned dates stay put
        // push by working days so nothing lands on a weekend and lengths stay the same
        const s0=dn(t.start);const up=Object.assign({},moveTo(t,addWorkdays(isWork(s0)?s0:nextWorkday(s0),days,t.calDays)),stamp());
        await S.db.doc("items/"+t.id).update(up);moved++;changes.set(t.id,up);
        if(!p&&S.drawer&&t.id===S.drawer.id)mine=up;
      }
      // anything linked downstream that wasn't already moved follows along
      const plan=planCascade(changes,before);
      for(const [id,up] of plan){if(changes.has(id))continue;await S.db.doc("items/"+id).update(Object.assign({},up,stamp()));moved++;changes.set(id,up)}
    }
    await logHistory("delay","Logged "+plural(days,"working day")+" of delay on "+it.name+" ("+entry.cause+")"+(moved?" · "+plural(moved,"item")+" moved":""),[...changes].map(([id,up])=>itemChange(before.find(b=>b.id===id),up)));
    if(mine){ // keep the open form in step with the dates just moved
      if(mine.start&&$("f_start"))$("f_start").value=mine.start;
      if(mine.end&&$("f_end"))$("f_end").value=mine.end;
      if(mine.onsite){S.drawer.onsite=mine.onsite.slice();renderOnsite()}
    }
    toast("Delay logged"+(moved?" · "+plural(moved,"item")+" moved "+plural(days,"day"):""));
    if(p)closeDrawer();else{const det=$("dlDetails");if(det){det.open=false;$("d_expl").value=""}}
  }catch(e){dbErr(e)}
}

// history/{id}: {projectId, at, by, action, summary, changes:[{coll, id, name, before, after}]}
// before:null = it was added, after:null = it was deleted, otherwise the changed fields only.
const TRACK=["name","start","end","status","pct","phaseId","category","sub","contact","notes","onsite","preds","cons","calDays","lockOnsite","actualStart","actualEnd","baseStart","baseEnd"];
const FIELD_TXT={name:"Name",start:"Start",end:"Finish",status:"Status",pct:"% complete",phaseId:"Phase",category:"Trade",sub:"Subcontractor",contact:"Contact",notes:"Notes",onsite:"On-site dates",preds:"Links",cons:"Constraint",calDays:"Calendar days",lockOnsite:"Sub dates locked",actualStart:"Actual start",actualEnd:"Actual finish",baseStart:"Baseline start",baseEnd:"Baseline finish",title:"Title",date:"Date",itemId:"Linked task",text:"Details",done:"Met",kind:"Type",calendar:"Work calendar",contractValue:"Contract value",retainagePct:"Retainage %",startDate:"Project start",endDate:"Project end",targetFinish:"Contract finish",number:"Job number",client:"Client",address:"Address",super:"Super / PM",activeBaseline:"Active baseline",statusDate:"Status date"};
const same=(a,b)=>JSON.stringify(a==null?null:a)===JSON.stringify(b==null?null:b);
const snapItem=i=>{const o={};TRACK.concat(["kind","projectId"]).forEach(k=>{if(i[k]!==undefined)o[k]=i[k]});return o};
function itemChange(prev,next){
  if(!prev||!next)return null;const before={},after={};
  Object.keys(next).forEach(k=>{if(!TRACK.includes(k))return;if(!same(prev[k],next[k])){before[k]=prev[k]==null?null:prev[k];after[k]=next[k]==null?null:next[k]}});
  return Object.keys(after).length?{coll:"items",id:prev.id,name:prev.name,before,after}:null;
}
async function logHistory(action,summary,changes){

  try{await S.db.collection("history").add({projectId:S.pid,at:Date.now(),by:S.uid||null,action,summary,changes:ch.slice(0,150)})}catch(e){console.error(e)}

function fmtVal(k,v){
  if(v==null||v==="")return "—";
  if(["start","end","actualStart","actualEnd","baseStart","baseEnd","date","startDate","endDate","targetFinish","statusDate"].includes(k))return fmtY(dn(v));
  if(k==="preds")return (v||[]).length?v.map(p=>{const l=typeof p==="string"?{id:p,type:"FS",lag:0}:p;return linkLabel(l,S.items.find(i=>i.id===l.id))}).join("; "):"none";
  if(k==="onsite")return plural((v||[]).length,"day");
  if(k==="cons")return ({SNET:"Start no earlier than ",MSO:"Must start on "}[v.type]||"")+fmt(dn(v.date));
  if(k==="phaseId"||k==="itemId"){const p=S.items.find(i=>i.id===v);return p?p.name:"(removed)"}
  if(k==="activeBaseline"){const b=S.baselines.find(x=>x.id===v);return b?b.name:"—"}
  if(typeof v==="boolean")return v?"yes":"no";
  if(k==="calendar")return (v.days||[]).length+" work days a week, "+plural((v.holidays||[]).length,"holiday");
  if(k==="contractValue")return money(v);
  if(typeof v==="object")return "(changed)";
  const s=String(v);return s.length>60?s.slice(0,57)+"…":s;
}
function changeLines(c){
  if(!c)return [];
  if(c.before==null)return [(c.name||"Item")+": added"];
  if(c.after==null)return [(c.name||"Item")+": deleted"];
  return Object.keys(c.after).map(k=>(c.name?c.name+" · ":"")+(FIELD_TXT[k]||k)+": "+fmtVal(k,c.before[k])+" → "+fmtVal(k,c.after[k]));
}
function historyHTML(){

      (lines.length?"<details><summary>"+plural(lines.length,"change")+"</summary><ul>"+lines.slice(0,100).map(l=>"<li>"+esc(l)+"</li>").join("")+(lines.length>100?"<li>…and "+(lines.length-100)+" more</li>":"")+"</ul></details>":"")+"</div>"+

async function revertHistory(id){
  const e=S.history.find(x=>x.id===id);if(!e)return;const ch=[];
  try{
    for(const c of (e.changes||[]).slice().reverse()){
      if(!c||(c.coll!=="items"&&c.coll!=="entries"))continue;
      const ref=S.db.doc(c.coll+"/"+c.id);const cur=(c.coll==="items"?S.items:S.entries).find(x=>x.id===c.id);
      if(c.before==null){if(cur){await ref.delete();const {id:_i,...rest}=cur;ch.push({coll:c.coll,id:c.id,name:c.name,before:rest,after:null})}}
      else if(c.after==null){if(!cur){await ref.set(Object.assign({},c.before));ch.push({coll:c.coll,id:c.id,name:c.name,before:null,after:c.before})}}
      else if(cur){const up={},was={};Object.keys(c.before).forEach(k=>{up[k]=c.before[k];was[k]=cur[k]==null?null:cur[k]});await ref.update(Object.assign(up,stamp()));ch.push({coll:c.coll,id:c.id,name:c.name,before:was,after:c.before})}
    }
    await logHistory("restore","Restored: "+(e.summary||"a change"),ch);
    toast(ch.length?"Restored "+plural(ch.length,"record"):"Nothing to restore; those records already match");
  }catch(err){dbErr(err)}
}

/* ---------- status-date progress update ---------- */
// Unfinished work that should already have happened moves to start on the status date;
// in-progress work gets its remaining days counted from the status date. Linked items follow.
function planProgress(sd){
  const before=S.items.map(i=>Object.assign({},i));const changes=new Map();const s0=nextWorkday(sd);
  for(const i of S.items){
    if(i.status==="Complete"||!i.start||(i.cons&&i.cons.type==="MSO"))continue;
    const s=startOf(i),e=endOf(i);const started=i.status==="In progress"||!!i.actualStart||(Number(i.pct)||0)>0;
    if(!started){if(s<sd)changes.set(i.id,moveTo(i,s0))}
    else if(i.kind!=="milestone"&&i.end){const total=durOf(i)+1;const remain=Math.max(1,Math.ceil(total*(1-(Number(i.pct)||0)/100)));const ne=addWorkdays(s0,remain-1,i.calDays);if(ne>e)changes.set(i.id,{end:ds(ne)})}
  }
  const plan=planCascade(changes,before);
  plan.forEach((v,k)=>changes.set(k,Object.assign(changes.get(k)||{},v)));
  return {changes,before};
}

/* ---------- import from Microsoft Project (XML, or Excel/CSV export) ---------- */
function parseMSPXml(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length||!doc.getElementsByTagName("Task").length)throw new Error("Not a Microsoft Project XML file.");
  const kid=(el,tag)=>{for(const c of el.children)if(c.localName===tag)return c.textContent;return ""};
  const ELAPSED=new Set(["4","6","8","10","12","36","38","40","42","44"]);
  return [...doc.getElementsByTagName("Task")].map(t=>({ref:kid(t,"UID"),name:kid(t,"Name").trim(),start:dn(kid(t,"Start").slice(0,10)),finish:dn(kid(t,"Finish").slice(0,10)),outline:Number(kid(t,"OutlineLevel"))||1,summary:kid(t,"Summary")==="1",milestone:kid(t,"Milestone")==="1",pct:Number(kid(t,"PercentComplete"))||0,calDays:ELAPSED.has(kid(t,"DurationFormat")),notes:kid(t,"Notes"),
    links:[...t.children].filter(c=>c.localName==="PredecessorLink").map(pl=>({ref:kid(pl,"PredecessorUID"),type:{"0":"FF","1":"FS","2":"FS","3":"SS"}[kid(pl,"Type")]||"FS",lag:Math.round((Number(kid(pl,"LinkLag"))||0)/4800)}))})).filter(t=>t.ref!=="0"&&t.name&&t.start!=null);
}
function parseMSPRows(sheets){
  for(const sh of sheets){
    const rows=sh.rows;let hi=-1,H=null;
    for(let i=0;i<Math.min(10,rows.length);i++){const h=rows[i].map(c=>String(c).trim().toLowerCase());if(h.some(c=>c==="name"||c==="task name")&&h.some(c=>/^(start|finish)/.test(c))){hi=i;H=h;break}}
    if(hi<0)continue;
    const col=(...res)=>{for(const re of res){const i=H.findIndex(c=>re.test(c));if(i>=0)return i}return -1};
    const cN=col(/^task name$/,/^name$/),cS=col(/^start/),cF=col(/^finish/),cP=col(/^predecessors?$/),cO=col(/outline level/),cI=col(/^id$/,/^unique id$/),cD=col(/^duration/),cPc=col(/% complete/),cM=col(/^milestone/),cSu=col(/^summary/);
    const day=v=>v instanceof Date||typeof v==="number"?parseDay(v):parseDay(String(v||"").replace(/^[A-Za-z]{3,9}\.?\s+/,"").replace(/\s+\d{1,2}:\d{2}.*$/,""));
    const tasks=rows.slice(hi+1).map((r,ix)=>{const durTxt=cD>=0?String(r[cD]||""):"";
      return {ref:cI>=0&&String(r[cI]).trim()?String(r[cI]).trim():String(ix+1),name:String(r[cN]||"").trim(),start:day(r[cS]),finish:cF>=0?day(r[cF]):null,outline:cO>=0?Number(r[cO])||1:1,
        summary:cSu>=0?/^(yes|true|1)$/i.test(String(r[cSu]).trim()):false,milestone:cM>=0?/^(yes|true|1)$/i.test(String(r[cM]).trim()):/^0\s*e?(d|day|days)?\??$/i.test(durTxt.trim()),
        pct:cPc>=0?num(r[cPc])||0:0,calDays:/\d\s*e(d|day|days|w|wk|wks|weeks)\b/i.test(durTxt),links:cP>=0?parsePredText(String(r[cP]||"")):[]}}).filter(t=>t.name&&t.start!=null);
    // without a Summary column, a task is a summary when the next one is indented under it
    if(cSu<0)tasks.forEach((t,i)=>{const n=tasks[i+1];if(n&&n.outline>t.outline)t.summary=true});

}
function parsePredText(s){ // "3FS+2 days, 5SS, 7"
  return s.split(/[,;]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=x.match(/^(\d+)\s*(FS|SS|FF|SF)?\s*(?:([+-])\s*(\d+(?:\.\d+)?)\s*(e?)(d|day|days|w|wk|wks|week|weeks|h|hr|hrs|hour|hours)?)?/i);if(!m)return null;
    let lag=0;if(m[4]){const v=Number(m[4]);const u=(m[6]||"d").toLowerCase();lag=u.startsWith("w")?v*(m[5]?7:5):u.startsWith("h")?v/8:v;lag=Math.round(lag)*(m[3]==="-"?-1:1)}

}
function importPlan(tasks){

  const byRef=new Map(tasks.map(t=>[t.ref,t]));
  return tasks.map(t=>{
    const kind=t.summary?"phase":(t.milestone||(t.finish!=null&&t.finish===t.start&&!t.calDays&&false)?"milestone":"task");
    const preds=t.links.map(l=>{const p=byRef.get(l.ref);if(!p)return null;return l.type==="FS"&&!l.lag?p.newId:{id:p.newId,type:l.type,lag:l.lag}}).filter(Boolean);
    const start=ds(t.start),end=kind==="milestone"?null:ds(t.finish!=null?Math.max(t.finish,t.start):t.start);
    const status=t.pct>=100?"Complete":t.pct>0?"In progress":"Not started";
    return {id:t.newId,body:{projectId:S.pid,kind,name:t.name,phaseId:kind==="phase"?"":(t.parent?t.parent.newId:""),start:kind==="phase"?null:start,end:kind==="phase"?null:end,baseStart:kind==="phase"?null:start,baseEnd:kind==="phase"?null:end,
      status,pct:Math.round(t.pct),preds,calDays:!!t.calDays,notes:t.notes||"",category:"",sub:"",contact:"",onsite:[],createdAt:Date.now()},outline:t.outline};
  });
}
